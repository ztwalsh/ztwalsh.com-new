<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  /* Resolve every relative path (the font, the app, the galaxy) from this page's own
     folder, however the address arrives: /galaxy-creator, /galaxy-creator/ or
     /galaxy-creator/index.html. Without this, a host that drops "index.html" would
     send them all one folder too high. */
  (function () {
    var p = location.pathname;
    var dir = /\/[^/]*\.html?$/.test(p) ? p.replace(/[^/]*$/, '') : p.replace(/\/?$/, '/');
    var b = document.createElement('base'); b.href = dir; document.head.appendChild(b);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaxy Creator</title>

<script>

  if (/(?:^#|&)[gs]=/.test(location.hash)) location.replace('create/index.html' + location.hash);
</script>
<script>
  /* Google Analytics, the same property the rest of the site reports to.
     Like the app, this page is a static file in public/, so the site's layout
     never runs for it and it would otherwise go uncounted. Set the id to an empty
     string to drop it, and the folder makes no outside requests at all. */
  window.ANALYTICS_ID = 'G-8H02CWQTGC';
  if (window.ANALYTICS_ID) {
    var gaTag = document.createElement('script');
    gaTag.async = true;
    gaTag.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.ANALYTICS_ID;
    document.head.appendChild(gaTag);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', window.ANALYTICS_ID);
  }
</script>
<style>
  /* The landing page: the live galaxy behind big, bold white display type.
     Monochrome like the app: white type, one white button. */
  @font-face {
    font-family: "Geist"; font-style: normal; font-weight: 100 900;
    font-display: swap; src: url("./geist.woff2") format("woff2");
  }
  :root {
    --spring-pop: cubic-bezier(0.34, 1.4, 0.64, 1);
    --spring-smooth: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-exit: cubic-bezier(0.32, 0, 0.67, 0);
    --face: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root {
      --spring-pop: linear(0, 0.065, 0.209, 0.386, 0.565, 0.725, 0.857, 0.955, 1.022, 1.062, 1.08, 1.083, 1.076, 1.063, 1.048, 1.033, 1.02, 1.01, 1.002, 0.997, 0.994, 0.993, 0.993, 0.994, 0.995, 0.996, 0.998, 0.999, 0.999, 1, 1);
      --spring-smooth: linear(0, 0.033, 0.106, 0.199, 0.3, 0.387, 0.482, 0.568, 0.644, 0.702, 0.759, 0.807, 0.847, 0.876, 0.903, 0.925, 0.942, 0.956, 0.966, 0.974, 0.981, 0.986, 0.99, 0.993, 0.995, 0.996, 0.998, 0.998, 0.999, 1, 1);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #000; color-scheme: dark; }
  body { font-family: var(--face); color: #fff; background: #000; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }

  /* The galaxy, live, full bleed and behind everything. */
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; pointer-events: none; z-index: 0; }
  /* A soft veil so white type stays crisp over the brightest core. */
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 100%); }

  /* The display type: big, bold, tight, white. */
  .display {
    font-weight: 800; letter-spacing: -0.055em; line-height: 0.86; color: #fff;
    font-size: clamp(64px, 15vw, 240px); text-wrap: balance;
  }
  .display span { display: block; }
  .display { text-shadow: 0 2px 40px rgba(0,0,0,0.28); }
  .sub { font-size: clamp(15px, 1.4vw, 19px); line-height: 1.5; color: rgba(255,255,255,0.78); font-weight: 400; letter-spacing: -0.005em; text-shadow: 0 1px 14px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.6); }

  /* The one button: white pill, black words, a small arrow that leans in on hover. */
  .cta {
    display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 26px 0 28px; border-radius: 999px;
    background: #fff; color: #000; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; border: 0; cursor: pointer;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    transition: transform 0.45s var(--spring-pop), box-shadow 0.3s;
  }
  .cta svg { width: 18px; height: 18px; transition: transform 0.45s var(--spring-pop); }
  .cta:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 16px 50px rgba(0,0,0,0.45); }
  .cta:hover svg { transform: translateX(3px); }
  .cta:active { transform: scale(0.96); transition-duration: 0.1s; }
  .cta:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  /* A quiet top bar: home on the left, the app on the right. */
  .top { position: fixed; z-index: 5; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 22px clamp(20px, 3vw, 40px); font-size: 13px; color: rgba(255,255,255,0.6); }
  .top a:hover { color: #fff; }
  .top b { color: #fff; font-weight: 600; letter-spacing: -0.01em; }

  /* Entry: words rise out of a blur, staggered (MOTION.md). */
  .rise { opacity: 0; transform: translateY(0.25em); filter: blur(14px); animation: rise 1.1s var(--spring-smooth) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; filter: blur(0); } }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; transform: none; filter: none; } }

  /* The cover: the galaxy up and to the right, the name edge to edge along the bottom. */
  #sky { width: 128%; height: 116%; top: -8%; }   /* wider than the screen, so the galaxy sits right of centre */
  .veil { background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0) 55%), radial-gradient(120% 90% at 60% 40%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.5) 100%); }
  main { position: relative; z-index: 2; min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 clamp(16px, 2.4vw, 36px) clamp(10px, 1.6vw, 24px); }
  .row { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 0 0.3vw clamp(18px, 2vw, 30px); }
  .sub { max-width: 34ch; text-wrap: pretty; }
  .display { font-size: 15.6vw; letter-spacing: -0.065em; line-height: 0.8; white-space: nowrap; margin-left: -0.05em; pointer-events: none; }   /* its tight lines overlap the button above */
  .display span { display: inline; }
  @media (max-width: 700px) {
    #sky { width: 100%; height: 100%; top: -14%; }
    .row { flex-direction: column; align-items: flex-start; }
    .display { font-size: 23vw; white-space: normal; }
    .display span { display: block; }
  }
</style>
</head>
<body>
<iframe id="sky" src="create/index.html?embed" title="" aria-hidden="true" tabindex="-1"></iframe>
<div class="veil"></div>
<header class="top"><a href="/"><b>ztwalsh.com</b></a><a href="create/index.html">Open the app</a></header>
<main>
  <div class="row">
    <p class="sub rise" style="animation-delay:.5s">Create a galaxy from nothing. Direct it like a film. Share it as an 8K still, a video, or a link.</p>
    <a class="cta rise" style="animation-delay:.65s" href="create/index.html">Get started <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
  <h1 class="display"><span class="rise" style="animation-delay:.1s">Galaxy </span><span class="rise" style="animation-delay:.22s">Creator</span></h1>
</main>
<script>
/* Connect to the embedded galaxy, show the house look (the default
   Andromeda-style galaxy, unsaved, so a visitor's own galaxy is untouched), and offer
   a few camera helpers. */
(function () {
  'use strict';
  const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  function connect(frame) {
    return new Promise((resolve) => {
      const tryNow = () => { try { const g = frame.contentWindow && frame.contentWindow.galaxy; if (g) { resolve(g); return true; } } catch (e) {} return false; };
      if (tryNow()) return;
      const iv = setInterval(() => { if (tryNow()) clearInterval(iv); }, 50);
    });
  }
  async function start(opts) {
    const G = await connect(document.getElementById('sky'));
    G.setLive(Object.assign({}, G.base, opts && opts.look), false);   // the house galaxy, this visit only
    return G;
  }
  // Glide the camera from where it is to a target over ms, eased (for handoffs and scroll).
  function glide(G, to, ms, done) {
    const from = G.camera(), t0 = performance.now();
    const lerp = (a, b, k) => a + (b - a) * k;
    const ease = (k) => 1 - Math.pow(1 - k, 3);
    (function step(now) {
      const k = still() ? 1 : Math.min(1, (now - t0) / ms), e = ease(k);
      G.setCamera({
        yaw: lerp(from.yaw, to.yaw ?? from.yaw, e), pitch: lerp(from.pitch, to.pitch ?? from.pitch, e), roll: lerp(from.roll, to.roll ?? from.roll, e),
        focus: from.focus.map((v, i) => lerp(v, (to.focus || from.focus)[i], e)),
        dist: Math.exp(lerp(Math.log(from.dist), Math.log(to.dist ?? from.dist), e)),
      });
      if (k < 1) requestAnimationFrame(step); else if (done) done();
    })(performance.now());
  }
  window.Landing = { start, glide, still };
})();
</script>
<script>
  Landing.start();
  // The name runs exactly edge to edge: measure it and set the size to fit.
  const h = document.querySelector('.display');
  function fit() {
    if (innerWidth <= 700) { h.style.fontSize = ''; return; }
    h.style.fontSize = '100px'; h.style.width = 'max-content';
    const w = h.getBoundingClientRect().width, cs = getComputedStyle(h.parentElement);
    const room = h.parentElement.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    h.style.width = '';
    h.style.fontSize = (100 * room / w * 0.99) + 'px';
  }
  document.fonts.ready.then(fit); addEventListener('resize', fit);
</script>
</body>
</html>
