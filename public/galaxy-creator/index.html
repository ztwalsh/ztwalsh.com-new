    gl.uniform1f(U.uCore, S.core);
    gl.uniform1f(U.uSpread, comp ? comp.spread : S.spread);
    gl.uniform1f(U.uSeed, (S.seed % 1000) * 0.137);
    gl.uniform1i(U.uKind, kind);
    gl.uniform3fv(U.uOld, col.old);
    gl.uniform3fv(U.uYoung, col.young);
    gl.uniform1i(U.uFrom, comp ? 2 : mFrom);
    gl.uniform1i(U.uTo, comp ? 2 : mTo);
    gl.uniform1f(U.uK, !comp && morphing ? smoother(mK) : 0);
    gl.uniform3fv(U.uOffset, comp ? comp.offset : [0, 0, 0]);
    gl.uniform1f(U.uScale, comp ? comp.scale : 1);
    gl.uniformMatrix4fv(U.uView, false, view);
    gl.uniformMatrix4fv(U.uProj, false, proj);
  }
  // How much gas each type carries: ellipticals are nearly spent.
  const typeMix = (arr) => { const k = morphing ? smoother(mK) : 0; return arr[mFrom] + (arr[mTo] - arr[mFrom]) * k; };
  const GAS_BY_TYPE = [1, 1, 0.12, 0.8, 0.6];
  const STRETCH_BY_TYPE = [1, 1, 1, 1, 0.25];
  const HAZE_BY_TYPE = [1, 1, 1, 0.35, 0.8];
  const DUST_BY_TYPE = [1, 1, 0.35, 0.6, 0.3];
  const starCount = () => Math.max(1000, Math.round(MAX_STARS * S.stars * S.stars));

  // o, when given, renders off screen: { rt, fbo, w, h, dpr, mip } (see exportImage).
  function render(now, o) {
    const R = o ? o.rt : RT, px = o ? o.dpr : dpr;
    const cw = o ? o.w : canvas.width, ch = o ? o.h : canvas.height;
    const eye = [dist * Math.cos(pitch) * Math.sin(yaw), dist * Math.sin(pitch), dist * Math.cos(pitch) * Math.cos(yaw)];
    for (let i = 0; i < 3; i++) eye[i] += focus[i];
    const view = rollView(lookAt(eye, focus, [0, 1, 0]), roll);
    const proj = perspective(FOV, W / H, Math.max(1e-4, dist * 0.002), 200);
    proj[8] -= LENS[0]; proj[9] -= LENS[1];
    lastView = view;
    const focalPx = (H / 2) / Math.tan(FOV / 2);
    const gasK = typeMix(GAS_BY_TYPE), dustK = typeMix(DUST_BY_TYPE);
    gl.disable(gl.DEPTH_TEST);

    // Glow: unresolved starlight and the emission nebulae, at half size.
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.glow.fbo);
    gl.viewport(0, 0, R.glow.w, R.glow.h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(cloudProg);
    gl.uniform3fv(CU.uGasA, col.gasA);
    gl.uniform3fv(CU.uGasB, col.gasB);
    gl.uniform1f(CU.uStretch, typeMix(STRETCH_BY_TYPE));
    gl.uniform1f(CU.uHazeSize, typeMix(HAZE_BY_TYPE));
    galaxyUniforms(CU, 1, view, proj);
    gl.uniform1f(CU.uGain, 0.0045 * (0.4 + 0.6 * S.stars));
    gl.bindVertexArray(hazeGeo.vao);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, HAZE_N);
    if (S.companions) COMPANIONS.forEach((c) => {
      galaxyUniforms(CU, 1, view, proj, c);
      gl.uniform1f(CU.uHazeSize, 1);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, COMP_HAZE);
    });
    const nebN = Math.round(NEB_N * clamp(S.nebula, 0, 1) * Math.min(1, gasK));
    if (nebN > 0) {
      galaxyUniforms(CU, 2, view, proj);
      gl.uniform1f(CU.uGain, 0.5 * (0.5 + 0.5 * S.nebula) * Math.min(1.2, gasK));
      gl.bindVertexArray(nebGeo.vao);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nebN);
    }

    // Dust: a transmittance layer, cleared to clear glass and multiplied down.
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.dust.fbo);
    gl.clearColor(1, 1, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    const dustN = Math.round(DUST_N * clamp(S.dust, 0, 1) * Math.min(1, dustK));
    if (dustN > 0) {
      gl.blendFunc(gl.ZERO, gl.SRC_COLOR);
      galaxyUniforms(CU, 3, view, proj);
      gl.uniform1f(CU.uGain, 0.4 * (0.4 + 0.6 * S.dust));
      gl.bindVertexArray(dustGeo.vao);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, dustN);
    }

    // Stars, the sky behind them, and the spikes, at full size.
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.stars.fbo);
    gl.viewport(0, 0, cw, ch);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(bgProg);
    gl.uniformMatrix4fv(BU.uView, false, view);
    gl.uniformMatrix4fv(BU.uProj, false, proj);
    gl.uniform1f(BU.uDpr, px);
    gl.uniform1f(BU.uGain, 1.4);
    gl.bindVertexArray(bgGeo.vao);
    gl.drawArrays(gl.POINTS, 0, bgGeo.n);

    const count = starCount();
    const gain = 3.6 / (S.stars * S.stars * 0.6 + 0.4);
    gl.useProgram(starProg);
    galaxyUniforms(SU, 0, view, proj);
    gl.uniform1f(SU.uFocalPx, focalPx);
    gl.uniform1f(SU.uSize, S.size);
    gl.uniform1f(SU.uDpr, px);
    gl.uniform1f(SU.uGain, gain);
    gl.bindVertexArray(starGeo.vao);
    gl.drawArrays(gl.POINTS, 0, count);
    if (S.companions) COMPANIONS.forEach((c) => {
      galaxyUniforms(SU, 0, view, proj, c);
      gl.uniform1f(SU.uGain, gain * 0.45);                      // mostly glow, a little grain
      gl.drawArrays(gl.POINTS, 0, COMP_STARS);
    });

    if (S.spikes && heroCount) {
      gl.useProgram(spikeProg);
      galaxyUniforms(KU, 0, view, proj);
      gl.uniform1f(KU.uGain, gain);
      gl.uniform1f(KU.uCount, count);
      gl.uniform1f(KU.uDpr, px);
      gl.uniform2f(KU.uRes, cw, ch);
      gl.bindVertexArray(heroGeo.vao);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, heroCount);
    }
    gl.disable(gl.BLEND);

    // Composite, then bloom down and back up.
    gl.bindVertexArray(quadVao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.comp.fbo);
    gl.useProgram(compProg);
    bindTex(0, R.stars.tex, MU.uStars);
    bindTex(1, R.glow.tex, MU.uGlow);
    bindTex(2, R.dust.tex, MU.uDust);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.useProgram(downProg);
    // Off screen, the chain starts finer and the glow is read from the level that
    // matches the screen's first one, so the bloom keeps its size at any resolution.
    const m0 = o ? o.mip : 0;
    let src = R.comp;
    R.mips.forEach((m, i) => {
      gl.bindFramebuffer(gl.FRAMEBUFFER, m.fbo);
      gl.viewport(0, 0, m.w, m.h);
      bindTex(0, src.tex, DU.uSrc);
      gl.uniform2f(DU.uTexel, 1 / src.w, 1 / src.h);
      gl.uniform1i(DU.uFirst, i === 0 ? 1 : 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      src = m;
    });
    gl.useProgram(upProg);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = R.mips.length - 1; i > m0; i--) {
      const from = R.mips[i], to = R.mips[i - 1];
      gl.bindFramebuffer(gl.FRAMEBUFFER, to.fbo);
      gl.viewport(0, 0, to.w, to.h);
      bindTex(0, from.tex, UU.uSrc);
      gl.uniform2f(UU.uTexel, 1 / from.w, 1 / from.h);
      gl.uniform1f(UU.uRadius, 1.0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    gl.disable(gl.BLEND);

    gl.bindFramebuffer(gl.FRAMEBUFFER, o ? o.fbo : null);
    gl.viewport(0, 0, cw, ch);
    gl.useProgram(finalProg);
    bindTex(0, R.comp.tex, FU.uScene);
    bindTex(1, R.mips[m0].tex, FU.uBloom);
    // The eye adapts: deep inside, where everything is bright, stop down.
    const adapt = dist < 3.4 ? Math.pow(dist / 3.4, 0.55) : 1;
    gl.uniform1f(FU.uExposure, 0.7 * S.bright * S.bright * Math.max(adapt, 0.12));
    gl.uniform1f(FU.uBloomStr, S.bloom * 0.16);
    gl.uniform1f(FU.uSat, S.sat);
    gl.uniform1f(FU.uTime, now);
    gl.uniform1f(FU.uGrain, 0.018);
    gl.uniform2f(FU.uRes, cw, ch);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  function bindTex(unit, tex, loc) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(loc, unit);
  }

  function frame(ts) {
    const now = ts / 1000;
    const dt = Math.min(0.05, last ? now - last : 0.016);
    last = now;
    clock += dt;
    if (rec && recFrame(now)) { requestAnimationFrame(frame); return; }
    if (!paused) {
      gt += S.spin * 0.16 * dt;
      if (!drag && !goal) yaw += S.orbit * 0.25 * dt;
      yaw += yawVel * dt;
      pitch = clamp(pitch + pitchVel * dt, -PITCH_MAX, PITCH_MAX);
      const damp = Math.pow(0.12, dt);
      yawVel *= damp; pitchVel *= damp;
      if (morphing) {
        mK += dt / morphLen;
        if (mK >= 1) { mK = 0; mFrom = mTo; morphing = false; updateCaptions(); }
      } else if (S.type === 'Cycle') {
        holdT += dt;
        if (holdT > HOLD) morphTo((mTo + 1) % TYPES.length, MORPH);
      }
    }
    if (goal) {                                                      // glide to a picked view
      const k = 1 - Math.exp(-dt * (reduceMotion() ? 60 : 7));
      const dYaw = Math.atan2(Math.sin(goal.yaw - yaw), Math.cos(goal.yaw - yaw));
      yaw += dYaw * k;
      pitch += (goal.pitch - pitch) * k;
      roll += (goal.roll - roll) * k;
      for (let i = 0; i < 3; i++) focus[i] += (goal.target[i] - focus[i]) * k;
      if (Math.abs(dYaw) + Math.abs(goal.pitch - pitch) + Math.abs(goal.roll - roll) < 1e-3) goal = null;
    }
    // Zoom glides in log space, so the long trip in from the edge feels even.
    const want = zoomToDist(S.zoom);
    dist = Math.exp(Math.log(dist) + (Math.log(want) - Math.log(dist)) * (1 - Math.exp(-dt * (reduceMotion() ? 30 : 3.2))));
    render(now);
    requestAnimationFrame(frame);
  }

  // ---- captions -------------------------------------------------------------------------
  const toast = () => {};                    // the toolbar announces camera views itself
  function updateCaptions() {
    const name = morphing ? `${TYPE_NAMES[mFrom]} → ${TYPE_NAMES[mTo]}` : TYPE_NAMES[mTo];
    const K = window.Kit;
    if (K) {
      K.swapHTML($('cap-type'), name, true);
      K.rollText($('cap-seed'), '#' + S.seed);
      K.rollText($('cap-count'), starCount().toLocaleString('en-US'));
    } else {
      $('cap-type').textContent = name; $('cap-seed').textContent = '#' + S.seed;
      $('cap-count').textContent = starCount().toLocaleString('en-US');
    }
    $('phase').textContent = name;
  }
  function applyCaptions() { document.body.classList.toggle('clean', !S.captions || query.has('embed')); }

  // ---- PNG export ----------------------------------------------------------------------
  function grabPNG() {
    render(performance.now() / 1000);
    const w = canvas.width, h = canvas.height;
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    const o = out.getContext('2d');
    const img = o.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      const src = (h - 1 - y) * w * 4;
      img.data.set(px.subarray(src, src + w * 4), y * w * 4);
    }
    o.putImageData(img, 0, 0);
    return new Promise((res) => out.toBlob(res, 'image/png'));
  }

  // ---- high-resolution stills --------------------------------------------------------------
  // The frame on screen, framed exactly the same, rendered off screen with its long
  // edge at 4K, 6K or 8K. Stars, spikes and glow all scale with it, so it looks the
  // same, only sharper. The screen's own buffers are let go meanwhile to make room.
  const MAX_EDGE = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), ...gl.getParameter(gl.MAX_VIEWPORT_DIMS));
  const RGBA8 = { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE };
  const freeSet = (rt) => { if (rt) { ['stars', 'glow', 'dust', 'comp', 'out'].forEach((k) => freeTarget(rt[k])); rt.mips.forEach(freeTarget); } };
  function offscreen(edge, screenW, screenLevels) {
    const k = Math.min(edge, MAX_EDGE) / Math.max(W, H);
    const w = Math.round(W * k), h = Math.round(H * k);
    const hw = w >> 1, hh = h >> 1;
    // The bloom chain starts at this size's half and runs on until it is as coarse as the screen's.
    const mip = Math.max(0, Math.round(Math.log2(w / screenW)));
    const mips = [];
    let mw = hw, mh = hh;
    for (let i = 0; i < mip + screenLevels && mw > 2 && mh > 2; i++) { mips.push(target(mw, mh)); mw = mw >> 1; mh = mh >> 1; }
    const rt = { stars: target(w, h), glow: target(hw, hh), dust: target(hw, hh), comp: target(w, h), out: target(w, h, RGBA8), mips };
    const ok = gl.getError() === gl.NO_ERROR && [rt.stars, rt.comp, rt.out].every((t) => {
      gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
      return gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    });
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!ok) { freeSet(rt); return null; }
    return { rt, fbo: rt.out.fbo, w, h, dpr: k, mip: Math.min(mip, mips.length - 1) };
  }
  async function exportImage(edge) {
    await new Promise((r) => setTimeout(r, 40));                 // let the button show it is working
    const screenW = canvas.width, screenLevels = RT.mips.length;
    freeSet(RT); RT = null;
    gl.getError();
    let o = null;
    for (const e of [edge, 6144, 3840, 2560].filter((x) => x <= edge)) { o = offscreen(e, screenW, screenLevels); if (o) break; }
    let px = null;
    if (o) {
      render(performance.now() / 1000, o);
      gl.bindFramebuffer(gl.FRAMEBUFFER, o.fbo);
      px = new Uint8ClampedArray(o.w * o.h * 4);
      gl.readPixels(0, 0, o.w, o.h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      freeSet(o.rt);
    }
    resize();                                                    // the screen's buffers come back
    if (!px) throw Object.assign(new Error('too big'), { code: 'size' });
    const row = o.w * 4, tmp = new Uint8ClampedArray(row);       // GL rows run bottom up
    for (let y = 0, z = o.h - 1; y < z; y++, z--) {
      const a = y * row, b = z * row;
      tmp.set(px.subarray(a, a + row)); px.copyWithin(a, b, b + row); px.set(tmp, b);
    }
    const out = document.createElement('canvas');
    out.width = o.w; out.height = o.h;
    out.getContext('2d').putImageData(new ImageData(px, o.w, o.h), 0, 0);
    const blob = await new Promise((res) => out.toBlob(res, 'image/png'));
    out.width = out.height = 0;
    if (!blob) throw new Error('could not encode');
    return { blob, w: o.w, h: o.h };
  }

  // ---- loops -------------------------------------------------------------------------------
  // One full turn of the camera around the galaxy, recorded live from the canvas.
  // The camera comes back to where it began on its own; the stars' own orbits do
  // not, so the last stretch cross-fades into the first and the turn plays forever.
  let rec = null;
  const LOOP_TYPES = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const loopType = () => (window.MediaRecorder && HTMLCanvasElement.prototype.captureStream ? LOOP_TYPES.find((t) => MediaRecorder.isTypeSupported(t)) || '' : '');
  function recordLoop(seconds, onProgress) {
    const type = loopType();
    if (!type) return Promise.reject(Object.assign(new Error('unsupported'), { code: 'unsupported' }));
    if (rec) rec.cancel();
    // At most 1920 on the long edge, and even sizes, which video encoders insist on.
    const k = Math.min(1, 1920 / Math.max(canvas.width, canvas.height));
    const even = (v) => Math.max(2, Math.round(v * k / 2) * 2);
    const rc = document.createElement('canvas');
    rc.width = even(canvas.width); rc.height = even(canvas.height);
    const ctx = rc.getContext('2d');
    const stream = rc.captureStream(60);
    const mr = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: Math.round(rc.width * rc.height * 60 * 0.14) });
    const chunks = [];
    mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    return new Promise((resolve, reject) => {
      const stop = (err) => {
        if (!rec || rec.mr !== mr) return;
        rec = null;
        document.removeEventListener('visibilitychange', onHide);
        mr.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          const blob = new Blob(chunks, { type: type.split(';')[0] });
          if (err) reject(err);
          else if (!blob.size) reject(Object.assign(new Error('empty'), { code: 'empty' }));
          else resolve({ blob, ext: type.indexOf('mp4') >= 0 ? 'mp4' : 'webm' });
        };
        if (mr.state !== 'inactive') mr.stop(); else mr.onstop();
      };
      // Hidden tabs stop drawing, which would leave a hole in the loop.
      const onHide = () => { if (document.hidden) stop(Object.assign(new Error('hidden'), { code: 'hidden' })); };
      document.addEventListener('visibilitychange', onHide);
      rec = {
        mr, ctx, rc, T: seconds, F: Math.min(1.5, seconds * 0.15), t0: 0, onProgress,
        yaw, pitch, roll, focus: focus.slice(), dist: zoomToDist(S.zoom), gt, rate: S.spin * 0.16,
        stop, cancel: () => stop(Object.assign(new Error('cancelled'), { code: 'cancelled' })),
      };
    });
  }
  // One recorded frame: called from frame() in place of the usual motion.
  function recFrame(now) {
    const r = rec;
    if (!r.t0) { r.t0 = now; r.mr.start(1000); }
    const t = now - r.t0;
    if (t >= r.T) { r.stop(); return false; }
    pitch = r.pitch; roll = r.roll; dist = r.dist;
    for (let i = 0; i < 3; i++) focus[i] = r.focus[i];
    yaw = r.yaw + TAU * t / r.T;
    const fade = t > r.T - r.F ? smoother((t - (r.T - r.F)) / r.F) : 0;
    r.ctx.globalAlpha = 1;
    if (fade > 0) {                                              // the start, coming round again
      gt = r.gt + r.rate * (t - r.T);
      render(now);
      r.ctx.drawImage(canvas, 0, 0, r.rc.width, r.rc.height);
      r.ctx.globalAlpha = 1 - fade;
    }
    gt = r.gt + r.rate * t;                                      // drawn last, so it is what the screen shows
    render(now);
    r.ctx.drawImage(canvas, 0, 0, r.rc.width, r.rc.height);
    if (r.onProgress) r.onProgress(t / r.T);
    return true;
  }

  // ---- share links -------------------------------------------------------------------------
  function shareLink() {
    const f = ['1', LINK_TYPES.indexOf(S.type)];
    LINK_KEYS.forEach((k) => f.push(Math.round(S[k] * linkScale(k))));
    f.push((S.spikes ? 1 : 0) | (S.companions ? 2 : 0));
    const p = matchPreset();
    f.push(p ? p.toLowerCase() : [S.old, S.young, S.gasA, S.gasB].map((h) => h.slice(1)).join('_'));
    f.push(S.seed);
    const wrap = Math.atan2(Math.sin(yaw), Math.cos(yaw));
    [wrap, pitch, roll, focus[0], focus[1], focus[2]].forEach((v) => f.push(Math.round(v * 1000)));
    f.push(Math.round(gt * 100));
    return location.origin + location.pathname + '#g=' + f.join('.');
  }

  // ---- state: everything the toolbar (or an embedding page) can change ---------------------
  const pct = (v) => Math.round(v * 100) + '%';
  const fix2 = (v) => v.toFixed(2);
  const fmtZoom = (v) => { const d = zoomToDist(v); return d >= 1 ? d.toFixed(1) : d.toFixed(2); };
  const SLIDERS = [
    ['galaxy', 'arms', 'Arms', 1, 6, 1, (v) => String(v)],
    ['galaxy', 'twist', 'Twist', 0, 1.5, 0.01, fix2],
    ['galaxy', 'core', 'Core', 0, 1, 0.01, pct],
    ['galaxy', 'spread', 'Spread', 0, 1, 0.01, pct],
    ['matter', 'stars', 'Stars', 0.1, 1, 0.01, pct],
    ['matter', 'size', 'Star size', 0.3, 3, 0.05, fix2],
    ['matter', 'nebula', 'Nebula', 0, 1.5, 0.01, pct],
    ['matter', 'dust', 'Dust', 0, 1.5, 0.01, pct],
    ['motion', 'spin', 'Spin', 0, 3, 0.01, fix2],
    ['motion', 'orbit', 'Drift', 0, 1, 0.01, fix2],
    ['motion', 'zoom', 'Zoom', 0, 1, 0.001, fmtZoom],
    ['light', 'bright', 'Brightness', 0.2, 2.5, 0.01, fix2],
    ['light', 'bloom', 'Bloom', 0, 3, 0.01, fix2],
    ['light', 'sat', 'Saturation', 0, 2, 0.01, fix2],
  ];

  function setZoom(v) { S.zoom = clamp(v, 0, 1); persist(); }
  function setType(name) {
    S.type = name; persist();
    if (name !== 'Cycle') morphTo(TYPES.indexOf(name), PICK_MORPH);
    else holdT = HOLD - 1.5;
  }
  function matchPreset() {
    for (const n in PRESETS) {
      const p = PRESETS[n];
      if (p.old === S.old && p.young === S.young && p.gasA === S.gasA && p.gasB === S.gasB) return n;
    }
    return '';
  }
  function reseed() {
    S.seed = 1 + Math.floor(Math.random() * 99999);
    grow(); updateCaptions(); persist();
  }
  function surprise() {
    const r = Math.random;
    const t = TYPES[Math.floor(r() * TYPES.length)];
    const names = Object.keys(PRESETS);
    const p = names[Math.floor(r() * names.length)];
    Object.assign(S, {
      arms: 2 + Math.floor(r() * 3.6),
      twist: 0.25 + r() * 0.9,
      core: 0.15 + r() * 0.8,
      spread: 0.1 + r() * 0.6,
      nebula: 0.4 + r() * 1.0,
      dust: 0.3 + r() * 0.9,
      spin: 0.3 + r() * 0.9,
    }, PRESETS[p], { preset: p });
    applyColour();
    S.seed = 1 + Math.floor(Math.random() * 99999);
    grow();
    setType(t);
    updateCaptions();
  }

  // The galaxy's API. The toolbar below drives it; with ?embed, so does a host page.
  const embedded = query.has('embed');
  let capTimer = 0;
  window.galaxy = {
    state: S,
    base: BASE,
    sliders: SLIDERS.map(([group, key, label, min, max, step, fmt]) => ({ group, key, label, min, max, step, format: fmt })),
    types: TYPES.concat(['Cycle']),
    typeNames: TYPE_NAMES,
    presets: PRESETS,
    set(key, v) {
      const d = SLIDERS.find((x) => x[1] === key);
      if (!d) return;
      v = +clamp(Math.round((v - d[3]) / d[5]) * d[5] + d[3], d[3], d[4]).toFixed(4);
      if (key === 'zoom') { setZoom(v); return v; }
      S[key] = v;
      if (key === 'stars') { clearTimeout(capTimer); capTimer = setTimeout(updateCaptions, 140); }
      persist();
      return v;
    },
    setType,
    setPreset(name) { Object.assign(S, PRESETS[name], { preset: name }); applyColour(); persist(); },
    setColour(k, hex) { S[k] = hex; S.preset = matchPreset(); applyColour(); persist(); },
    toggle(id, v) {
      const key = { spikes: 'spikes', companions: 'companions', caps: 'captions' }[id];
      S[key] = v === undefined ? !S[key] : !!v;
      applyCaptions(); persist();
      return S[key];
    },
    reseed() { reseed(); persist(); },
    surprise() { surprise(); persist(); },
    save: () => grabPNG(),
    snap: () => grabPNG(),               // a PNG blob of the galaxy alone
    exportImage,                         // (edge) → { blob, w, h }: the same frame at 4K, 6K or 8K
    maxEdge: MAX_EDGE,
    recordLoop,                          // (seconds, onProgress) → { blob, ext }: one seamless turn
    cancelLoop: () => { if (rec) rec.cancel(); },
    canLoop: () => !!loopType(),
    link: shareLink,                     // a URL that opens exactly this galaxy, camera and all
    view(e) { return viewKey({ code: e.code || '', key: e.key || '', ctrlKey: !!e.ctrlKey, shiftKey: !!e.shiftKey }); },
    pause(v) { paused = v === undefined ? !paused : v; return paused; },
  };

  // Embedded, the host page owns the keyboard: hand every key up to it.
  if (embedded) {
    document.addEventListener('keydown', (e) => {
      if (window.parent === window) return;
      if (e.key === ' ') e.preventDefault();
      try { window.parent.postMessage({ type: 'galaxy-key', key: e.key, code: e.code, ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, metaKey: e.metaKey, altKey: e.altKey }, '*'); } catch (err) {}
    });
  }

  // ---- go --------------------------------------------------------------------------------
  if (shared) SLIDERS.forEach((d) => { const v = +S[d[1]]; S[d[1]] = clamp(isFinite(v) ? v : BASE[d[1]], d[3], d[4]); });
  // A GPU that runs out of room (a very large still, say) drops the context; start afresh.
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); setTimeout(() => location.reload(), 600); });
  S.preset = matchPreset();
  applyColour();
  applyCaptions();
  updateCaptions();
  if (embedded) document.body.classList.add('clean');
  if (reduceMotion()) dist = zoomToDist(S.zoom);
  window.addEventListener('resize', resize, { passive: true });
  resize();
  requestAnimationFrame(frame);
})();
</script>
<script>
(async function () {
  // The toolbar: the left rail and its flyout. Not built when embedded, or without WebGL2.
  if (!window.galaxy || new URLSearchParams(location.search).has('embed')) { const r = document.getElementById('rail'); if (r) r.hidden = true; return; }
  const { ICON, CATS, EASE, still } = Kit;
  const $ = (id) => document.getElementById(id);
  $('show').innerHTML = ICON.show + '<span>Show tools</span>';

  // Cards: the six categories, then Share and Settings below the camera. Camera and hide are actions.
  const SHARE = { id: 'share', label: 'Share', hint: 'A link, a big still, a loop' };
  const SETTINGS = { id: 'settings', label: 'Settings', hint: 'Appearance and keys' };
  const ALL = CATS.concat([SHARE, SETTINGS]);
  const tab = (c) => `<button class="ib" role="tab" data-cat="${c.id}" data-tip aria-label="${c.label}" aria-selected="false" type="button">${ICON[c.id]}</button>`;
  const cats = $('cats');
  cats.innerHTML = CATS.map(tab).join('') + '<hr>' +
    `<button class="ib" id="b-snap" data-tip aria-label="Snap image (S)" type="button">${ICON.camera}</button>` +
    tab(SHARE) + tab(SETTINGS) +
    `<button class="ib" id="b-hide" data-tip aria-label="Hide tools (H)" type="button">${ICON.hide}</button>`;
  const btns = () => Array.from(cats.querySelectorAll('[data-cat]'));
  let open = null;
  const pill = Kit.pillTrack(cats, btns, (b) => b.dataset.cat === open);
  Kit.tooltips(document.getElementById('rail'), 'right');
  Kit.roving(cats, '.ib', true);

  const G = window.galaxy;
  const fly = $('fly'), body = fly.querySelector('.body');
  const panes = {};
  const paneFor = (id) => panes[id] || (panes[id] = Kit.section(G, id));

  // Line the card up with its icon, kept on screen.
  function align(id) {
    const b = btns().find((x) => x.dataset.cat === id).getBoundingClientRect();
    const h = fly.offsetHeight;
    const top = Math.max(16, Math.min(innerHeight - h - 16, b.top + b.height / 2 - 34));
    return top;
  }

  function show(id) {
    const prev = open;
    open = id;
    btns().forEach((b) => b.setAttribute('aria-selected', String(b.dataset.cat === id)));
    pill.place(!!prev);
    const cat = ALL.find((c) => c.id === id);
    if (!prev) {
      // Grow the card out of the rail.
      fly.hidden = false;
      fly.querySelector('b').textContent = cat.label;
      fly.querySelector('.ctl-title span').textContent = cat.hint;
      body.replaceChildren(paneFor(id));
      fly.style.top = align(id) + 'px';
      if (body.firstChild.querySelector('.seg')) body.firstChild.querySelector('.seg')._place && body.firstChild.querySelector('.seg')._place();
      if (!still()) {
        fly.animate([{ opacity: 0, transform: 'translateX(-14px) scale(0.92)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0px)' }], { duration: 420, easing: EASE.smooth });
        Array.from(body.firstChild.children).forEach((c, i) => Kit.enter(c, { transform: 'translateY(6px)' }, 60 + i * 28));
      }
      return;
    }
    // Same card, new contents: morph height and position, blur the contents across.
    const dir = ALL.findIndex((c) => c.id === id) > ALL.findIndex((c) => c.id === prev) ? 1 : -1;
    const fromTop = fly.offsetTop;
    Kit.swapHTML(fly.querySelector('b'), cat.label, true);
    Kit.swapHTML(fly.querySelector('.ctl-title span'), cat.hint, true);
    // Measure the new height before the morph starts, so the card stays on screen.
    let toTop = fromTop;
    Kit.morphHeight(fly, () => { body.replaceChildren(paneFor(id)); toTop = align(id); fly.style.top = toTop + 'px'; });
    const seg = body.querySelector('.seg'); if (seg && seg._place) seg._place();
    if (!still()) {
      fly.animate([{ top: fromTop + 'px' }, { top: toTop + 'px' }], { duration: 420, easing: EASE.smooth });
      body.firstChild.animate([{ opacity: 0, filter: 'blur(6px)', transform: `translateY(${dir * 10}px)` }, { opacity: 1, filter: 'blur(0px)', transform: 'none' }], { duration: 360, easing: EASE.smooth });
    }
  }
  function close() {
    if (!open) return;
    open = null;
    btns().forEach((b) => b.setAttribute('aria-selected', 'false'));
    pill.hide();
    const done = () => { fly.hidden = true; };
    if (still()) return done();
    const a = fly.animate([{ opacity: 1, transform: 'none', filter: 'blur(0px)' }, { opacity: 0, transform: 'translateX(-10px) scale(0.96)', filter: 'blur(4px)' }], { duration: 170, easing: EASE.exit });
    a.onfinish = done;
  }
  btns().forEach((b) => b.addEventListener('click', () => (open === b.dataset.cat ? close() : show(b.dataset.cat))));

  // Hide: the rail slides away and a small pill offers the way back.
  function setTools(on) {
    document.body.classList.toggle('tools-off', !on);
    if (!on) close();
    $('show').hidden = on;
    if (!on) { Kit.enter($('show'), { transform: 'translateY(10px) scale(0.9)' }, 120); $('show').focus(); }
    else $('b-hide').focus();
  }
  $('b-hide').addEventListener('click', () => setTools(false));
  $('show').addEventListener('click', () => setTools(true));

  // Snap: a quick flash, the galaxy alone saved as a PNG. Words only when the tools are showing.
  let snapping = false;
  async function snap() {
    if (snapping) return;
    snapping = true;
    try {
      await Kit.shoot(G);
      if (!document.body.classList.contains('bare')) Kit.toast('Snapped', 'tick');
    } catch (e) {
      if (!(e && e.code === 'declined')) Kit.toast('Could not save the image');
    }
    snapping = false;
  }
  $('b-snap').addEventListener('click', snap);

  // ⌘. strips everything, text included; ⌘. or Esc brings it all back as it was.
  function setBare(on) {
    document.body.classList.toggle('bare', on);
    if (on && document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  const isBare = () => document.body.classList.contains('bare');

  Kit.bindKeys(G, {
    bare: () => setBare(!isBare()),
    snap,
    hide: () => { if (isBare()) { setBare(false); return; } setTools(document.body.classList.contains('tools-off')); },
    escape: () => { if (isBare()) { setBare(false); return; } close(); },
  });
  pill.hide();
  // ?clean opens on the galaxy alone; small screens start with the flyout closed.
  if (new URLSearchParams(location.search).has('clean')) setBare(true);
  if (innerWidth > 700) show('create');
})();
</script>
</body>
