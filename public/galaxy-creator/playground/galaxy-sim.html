<title>Galaxy sim · prototype</title>
<!-- The galaxy sim, playable: the year of the sim rules (.notes/plans/sim-rules.md) compressed into about thirty
     minutes. sim/sim.js runs the galaxy one day at a time; this page draws its 25 regions
     over the real galaxy (?embed, through galaxy.project()), turns its state into galaxy
     settings (setLive) so the picture ages with the sim, and gives you influence to spend.
     The game saves as a seed and the actions you took; the sim is deterministic, so
     loading replays them. -->
<link rel="stylesheet" href="kit.css">
<style>
  canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 2; }
  #hit { position: fixed; inset: 0; z-index: 3; cursor: grab; touch-action: none; }
  #hit.picking { cursor: crosshair; }

  /* Time and place, top left. */
  #clock { position: fixed; z-index: 9; left: 20px; top: 20px; width: 248px; padding: 14px; display: grid; gap: 12px; }
  #clock .era { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  #clock .era b { font-size: 18px; line-height: 22px; font-weight: 600; letter-spacing: -0.02em; }
  #clock .era small, #clock .when { color: var(--ink-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  #clock .when { display: flex; justify-content: space-between; margin-top: -6px; }

  #clock .concord-line b { color: #ffcc66; font-weight: 600; margin-right: 4px; }
  #clock .challenge { font-size: 11.5px; line-height: 1.45; color: var(--ink-2); margin-top: -4px; }

  #clock .challenge i { display: block; height: 3px; border-radius: 2px; margin-top: 5px; background: linear-gradient(90deg, #9fd8ff var(--p), rgba(255,255,255,0.12) var(--p)); }
  #clock .challenge.met b { color: #8ee6a8; }

  .year { position: relative; height: 4px; border-radius: 4px; background: var(--chrome-3); overflow: hidden; }

  /* Influence: what you have to spend, refilling a pip a day. */

  .pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .pips i { height: 8px; border-radius: 3px; background: var(--chrome-3); transition: background 0.25s; }
  .pips i.on { background: var(--ink); }
  .pips i.cost { background: #ff9f5a; }

  /* Actions, bottom centre. */
  #dock { position: fixed; z-index: 9; left: 50%; translate: -50% 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding: 8px; display: flex; gap: 4px; align-items: stretch; max-width: calc(100vw - 24px); }
  .act { border: 0; background: none; color: var(--ink); font: inherit; border-radius: 14px; padding: 8px 10px 7px; display: grid; justify-items: center; gap: 3px; min-width: 72px; cursor: pointer; transition: background 0.2s, transform var(--t-pop) var(--spring-pop), opacity 0.2s; }
  .act:hover { background: var(--chrome-2); }
  .act:active { transform: scale(0.94); transition-duration: 0.1s; }
  .act[aria-pressed="true"], .act[aria-pressed="true"]:hover { background: var(--ink); color: var(--on-ink); opacity: 1; }
  .act:disabled { opacity: 0.35; cursor: default; background: none; transform: none; }

  .speed button:hover { color: var(--ink); background: var(--chrome-2); }

  /* What you picked: a region, and whoever lives there. */

  .card-head { display: flex; align-items: center; gap: 10px; }
  .card-head b { display: block; font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .card-head small { color: var(--ink-3); font-size: 11.5px; }

  .card-head .x { margin-left: auto; }
  .bars { display: grid; gap: 7px; }
  .bar { display: grid; grid-template-columns: 76px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }

  .say { color: var(--ink-2); line-height: 1.45; background: var(--chrome-2); border-radius: 10px; padding: 9px 11px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }

  .trust span.on { background: var(--ink); color: var(--on-ink); font-weight: 600; }
  .trust small { grid-column: 1 / -1; color: var(--ink-3); font-size: 11px; line-height: 1.4; margin-top: 3px; }
  .card-acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

  .card-acts .btn:disabled { opacity: 0.4; cursor: default; }
  .sub { font-size: 11px; font-weight: 500; color: var(--ink-3); margin-bottom: -6px; }

  /* The chronicle as it happens, bottom left. */
  #feed { position: fixed; z-index: 8; left: 22px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: min(320px, calc(50vw - 360px)); display: grid; gap: 6px; pointer-events: none; }
  #feed div { color: rgba(255,255,255,0.82); font-size: 12.5px; line-height: 1.35; text-shadow: 0 1px 10px rgba(0,0,0,0.9); transition: opacity 0.6s, transform 0.5s var(--spring-smooth); }
  #feed div em { font-style: normal; color: rgba(255,255,255,0.45); font-variant-numeric: tabular-nums; margin-right: 6px; font-size: 11px; }
  #feed div.you { color: #ffd9a8; }
  #feed div.big { color: #fff; font-weight: 600; }

  /* A milestone: big and brief, in the middle of the sky. */
  #banner { position: fixed; z-index: 8; left: 50%; top: 22%; translate: -50% 0; text-align: center; color: #fff; pointer-events: none; opacity: 0; transition: opacity 0.7s, transform 0.9s var(--spring-smooth); transform: translateY(10px); text-shadow: 0 2px 24px rgba(0,0,0,0.85); width: min(640px, 90vw); }
  #banner.on { opacity: 1; transform: none; }
  #banner small { display: block; font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
  #banner b { font-size: clamp(22px, 3.4vw, 34px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; }

  /* Alerts: warnings and requests, most urgent first, each with its answer. */
  #alerts { position: fixed; z-index: 9; left: 50%; translate: -50% 0; top: 20px; width: min(420px, calc(100vw - 600px)); display: grid; gap: 6px; }
  .alert { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 9px 9px 9px 14px; border-radius: 16px; cursor: pointer; }
  .covered { text-align: center; font-size: 11.5px; color: rgba(255,255,255,0.6); text-shadow: 0 1px 8px rgba(0,0,0,0.9); }
  .alert.new { animation: alert-in 0.5s var(--spring-pop); }
  .alert i { width: 10px; height: 10px; border-radius: 50%; }
  .alert.hot i { animation: hot 0.9s ease-in-out infinite; }
  @keyframes hot { 50% { transform: scale(1.5); opacity: 0.5; } }
  @keyframes alert-in { from { transform: translateY(-8px) scale(0.96); opacity: 0; } }
  .alert > span { line-height: 1.35; font-size: 12.5px; color: var(--ink); }
  .alert > span small { display: block; color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .alert .btn { height: 32px; width: auto; padding: 0 12px; font-size: 12px; white-space: nowrap; }
  #alerts .more { background: none; border: 0; cursor: pointer; text-decoration: underline; font: inherit; }
  #alerts { max-height: calc(100vh - 140px); overflow: auto; }
  .alert.ghost { pointer-events: none; overflow: hidden; animation: ghost-out 1.5s forwards; }
  @keyframes ghost-out { 0%, 55% { opacity: 0.4; max-height: 140px; } 100% { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; } }
  .tbar { position: relative; height: 6px; border-radius: 3px; background: var(--chrome-3); margin: 8px 0 4px; }
  .tbar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: #ffcc66; }
  .tbar em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
  .tbar span { position: absolute; top: 9px; translate: -50% 0; font-size: 10.5px; color: var(--ink-3); }
  .alert .cost { display: block; color: var(--ink-2); }
  .alert .choices { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .alert .choices .btn:not(.primary) { background: var(--chrome-2); }
  .alert .ok { font-size: 11.5px; color: var(--ink-3); padding: 0 8px; white-space: nowrap; }
  #reopen { position: fixed; z-index: 9; left: 50%; translate: -50% 0; top: 20px; width: auto; padding: 0 18px; }
  .plus { position: fixed; z-index: 30; pointer-events: none; color: #ffd98a; font-weight: 700; font-size: 15px; text-shadow: 0 0 12px rgba(255,200,90,0.9), 0 1px 4px rgba(0,0,0,0.8); transition: transform 0.9s var(--spring-smooth), opacity 0.9s; }
  #power .legacy { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  #power .row .num { font-variant-numeric: tabular-nums; margin-left: 4px; }
  #power .row .of { color: var(--ink-3); font-size: 11px; }
  #power .legacy b { color: var(--ink); font-weight: 600; }
  #power .legacy .worth { font-style: normal; color: #ffcc66; }
  #power.full .pips i.on { background: #ffcc66; box-shadow: 0 0 6px rgba(255,204,102,0.6); }
  #power.full .row small { color: #ffcc66; }
  .pips i.part { background: linear-gradient(90deg, var(--ink) var(--p), var(--chrome-3) var(--p)); }
  .stars { font-size: 30px; letter-spacing: 4px; color: #ffcc66; }
  .stars span { color: var(--chrome-3); }
  .score { display: flex; justify-content: space-between; align-items: baseline; }
  .score b { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; }
  .tips { display: grid; gap: 6px; }
  .concord-moment { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 14px; border-radius: 14px; background: linear-gradient(135deg, rgba(255,204,102,0.18), rgba(255,204,102,0.04)); }
  .concord-moment i { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
  .concord-moment b { flex-basis: 100%; font-size: 17px; color: #ffcc66; margin-top: 4px; }
  .concord-moment small { color: var(--ink-2); font-size: 12px; }
  .breakdown summary { cursor: pointer; color: var(--ink-2); font-weight: 500; }
  .breakdown div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--hair); color: var(--ink-2); }
  .breakdown div small { display: block; color: var(--ink-3); font-size: 11px; }
  .breakdown div b { color: var(--ink); font-variant-numeric: tabular-nums; }
  #modal .pair { position: sticky; bottom: -24px; background: var(--chrome); padding: 12px 0 4px; margin-bottom: -4px; }
  .tips div { background: var(--chrome-2); border-radius: 10px; padding: 9px 11px; color: var(--ink-2); line-height: 1.45; }

  /* The coach: one next step, always, under the clock. */
  #coach { position: fixed; z-index: 9; left: 20px; top: 128px; width: 248px; padding: 12px 14px; display: grid; gap: 8px; }
  #coach small { font-size: 11px; font-weight: 500; color: var(--ink-3); display: flex; justify-content: space-between; }
  #coach small button { border: 0; background: none; color: var(--ink-3); font: inherit; cursor: pointer; padding: 0; }
  #coach small button:hover { color: var(--ink); }
  #coach p { line-height: 1.45; color: var(--ink); }
  #coach .btn { height: 34px; }
  .act { position: relative; }

  /* What a tool does, above the dock while you point at it or are using it. */
  #toolcard { position: fixed; z-index: 9; left: 50%; translate: -50% 0; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 24px)); padding: 14px 16px; display: grid; gap: 6px; transition: opacity 0.2s, transform 0.3s var(--spring-smooth); }

  /* The year's end, and the start. */

<body>
<iframe id="sky" src="../create/index.html?embed" title="Galaxy"></iframe>
<canvas id="map" class="layer"></canvas>
<div id="hit"></div>
<section id="clock" class="card"></section>
<section id="power" class="card"></section>

<div class="hint" id="hint"></div>

<section id="worldview" hidden></section>

<script src="ui.js"></script>
<script src="kit.js"></script>
<script src="sim/sim.js"></script>
<script src="sim/world.js"></script>
<script>
(async function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  Kit.backbar('Galaxy sim');
  // The way back leads to the hub (Create · Direct · Play), unless this was opened from the playground's own index.
  try { const r = document.referrer && new URL(document.referrer); if (r && /\/playground\/(index\.html)?$/.test(r.pathname)) sessionStorage.setItem('galaxy-sim-from', 'playground'); if (new URLSearchParams(location.search).get('from') === 'hub') sessionStorage.setItem('galaxy-sim-from', 'hub'); } catch (e) {}
  try { if (sessionStorage.getItem('galaxy-sim-from') !== 'playground') { const a = document.querySelector('.backbar a'); a.href = '../hub.html'; a.textContent = '← All modes'; a.nextSibling.remove(); a.nextSibling.remove(); } } catch (e) {}

  const G = await Kit.connect($('sky'));
  G.hold(true);
  G.set('spin', 0);                                             // still stars, so the regions stay put
  G.set('orbit', 0);
  // Far enough back that the whole disk fits, tall phones included.
  const HOME = { yaw: 0.6, pitch: 0.95, roll: 0, focus: [0, 0, 0], dist: 2.7 / Math.pow(Math.min(1, innerWidth / innerHeight * 1.4), 1.1) };
  G.setCamera(HOME);

  // ---- the game: a seed and what you did; the sim replays it ---------------------------------
  const SAVE = 'galaxy-sim-v2', BEST = 'galaxy-sim-best';
  const DAY_MS = 15 * 60 * 1000 / Sim.YEAR;                     // 1×: the year in fifteen minutes
  const SPEEDS = [0, 1, 4, 16];
  let s, speed = 1, acc = 0, selected = null, picking = null, hover = null, ended = false;
  const fx = [];                                                // short-lived effects on the map

  function start(seed, actions, upTo) {
    s = Sim.create(seed);
    shape = shapeFor(seed);
    const todo = (actions || []).slice();
    while (s.day < (upTo || 0) && s.day < Sim.YEAR) {
      while (todo.length && todo[0].day === s.day) { const a = todo.shift(); Sim.act(s, a.kind, a.region, a.civ); }
      Sim.step(s);
    }
    while (todo.length && todo[0].day === s.day) { const a = todo.shift(); Sim.act(s, a.kind, a.region, a.civ); }
    seen = s.log.length; selected = null; picking = null; ended = s.day >= Sim.YEAR; fx.length = 0;
    ['coach', 'alerts', 'card'].forEach((id) => { const el = $(id); el._key = el._shape = el._sig = el._order = el._last = null; if (el._ghosts) el._ghosts.clear(); });   // a new galaxy: nothing cached from the last
    tags.forEach((el) => el.remove()); tags.clear(); banners.length = 0;
    $('feed').innerHTML = '';
    s.log.filter((e) => !(e.you && /^You (sheltered|sent gas)/.test(e.text))).slice(-5).forEach((e) => feedLine(e));
    renderAll();
  }
  const save = () => store.set(SAVE, { seed: s.seed, actions: s.actions, day: s.day });
  // Today's galaxy: the same seed for everyone on a given day, with your best score for it.
  const today = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
  const isToday = () => s && s.seed === today();
  const dayBests = () => store.get(BEST + '-days') || {};
  const fresh = () => Math.floor(Math.random() * 1e6) + 1;
  function newGalaxy(seed) { $('reopen').hidden = true; start(seed); save(); setSpeed(1); if (s.trait) banner(s.trait.name, s.trait.text); }
  let seen = 0;

  // ---- where the regions are -------------------------------------------------------------
  // One disk unit of the sim is DISK world units of the galaxy; each region is a cell between
  // two radii and two angles, and its centre is where its lights go.
  const DISK = 1.42;
  const EDGES = [0, 0.12, 0.35, 0.62, 0.95];
  const at = (r, a) => [Math.cos(a) * r * DISK, 0, Math.sin(a) * r * DISK];
  const centre = (g) => (g.ring === 0 ? [0, 0, 0] : at(g.r, g.a));
  function cell(g) {                                            // the region's outline, in world space
    if (g.ring === 0) { const pts = []; for (let i = 0; i < 32; i++) pts.push(at(EDGES[1], i / 32 * TAU)); return pts; }
    const r0 = EDGES[g.ring], r1 = EDGES[g.ring + 1], a0 = g.a - Math.PI / 8, a1 = g.a + Math.PI / 8, pts = [];
    for (let i = 0; i <= 8; i++) pts.push(at(r1, lerp(a0, a1, i / 8)));
    for (let i = 8; i >= 0; i--) pts.push(at(r0, lerp(a0, a1, i / 8)));
    return pts;
  }
  function path(g2d, pts) {
    let ok = false;
    g2d.beginPath();
    pts.forEach((p, i) => { const q = G.project(p); if (!q) return; ok = true; if (i) g2d.lineTo(q.x, q.y); else g2d.moveTo(q.x, q.y); });
    g2d.closePath();
    return ok;
  }
  function regionAt(x, y) {
    const c = $('map').getContext('2d');
    for (let i = s.regions.length - 1; i >= 0; i--) { const g = s.regions[i]; if (path(c, cell(g)) && c.isPointInPath(x * dpr, y * dpr)) return g; }
    return null;
  }

  // ---- the galaxy's look follows the sim ----------------------------------------------------
  // Young, gassy and dustless at first light; old, gold and dusty by the end. A flare puffs up
  // the core's glow for a moment.
  let flareGlow = 0, shape = {};
  function shapeFor(seed) {
    let k = (seed * 9301 + 49297) % 233280; const r = () => ((k = (k * 9301 + 49297) % 233280) / 233280);
    const presets = Object.keys(G.presets);
    const type = ['Spiral', 'Spiral', 'Barred', 'Barred', 'Ring'][Math.floor(r() * 5)];
    return Object.assign({ type, arms: 2 + Math.floor(r() * 3), twist: +(0.8 + r() * 0.8).toFixed(2) }, G.presets[presets[Math.floor(r() * presets.length)]]);
  }
  function look(dt) {
    const L = Sim.look(s);
    flareGlow = Math.max(0, flareGlow - dt / 1600);
    G.setLive({
      ...shape,
      stars: clamp(0.14 + 0.86 * L.stars / 26, 0.1, 1),
      form: clamp(0.12 + 1.3 * Math.pow(L.youngFrac, 0.8), 0, 1.5),
      nebula: clamp(0.18 + 1.05 * L.gas / 14, 0, 1.5),
      dust: clamp(0.08 + 2.3 * L.metals, 0, 1.3),
      clump: clamp(0.3 + 0.6 * L.youngFrac, 0, 1),
      halo: 0.35 + 0.4 * Math.min(1, L.stars / 26) + 0.9 * flareGlow,
      hole: clamp((L.bh - 0.18) * 1.6, 0, 0.6),
      bloom: 0.9 + 0.6 * flareGlow,
      companions: !s.companion.merged,
    }, false);
  }

  // ---- drawing the map ------------------------------------------------------------------
  const dpr = Math.min(2, devicePixelRatio || 1);
  const map = $('map'), g2 = map.getContext('2d');
  function resize() { map.width = innerWidth * dpr; map.height = innerHeight * dpr; }
  addEventListener('resize', () => { resize(); placeCoach(); fitFeed(); }); resize();

  const tags = new Map();
  function tag(key, html, x, y, show, cls) {
    let el = tags.get(key);
    if (!el) { el = document.createElement('div'); el.className = 'tag' + (cls ? ' ' + cls : ''); document.body.append(el); tags.set(key, el); }
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = show ? 1 : 0;
  }
  // A light per system: each region a civilisation holds gets a little cluster of them.
  const sprinkle = (g, n) => { const out = []; let k = g.id * 7919 + 1; const r = () => ((k = (k * 16807) % 2147483647) / 2147483647); for (let i = 0; i < n; i++) { const a = r() * TAU, d = Math.sqrt(r()) * 0.06 * (g.ring + 1) / 2; const c = centre(g); out.push([c[0] + Math.cos(a) * d * DISK, 0, c[2] + Math.sin(a) * d * DISK]); } return out; };

  function draw(now) {
    const W = innerWidth, H = innerHeight;
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
    g2.clearRect(0, 0, W, H);
    const R = s.regions;
    squashNow = squash();
    const showGrid = picking || hover || selected !== null;
    // Habitability and life: a soft wash of green where life could take hold.
    R.forEach((g) => {
      if (!path(g2, cell(g))) return;
      const hab = g.hab;
      if (hab > Sim.K.lifeOn && g.civ === null && g.worlds) { g2.fillStyle = `rgba(70, 225, 120, ${0.1 + 0.18 * Math.min(1, hab)})`; g2.fill(); }
      const isSel = selected === g.id, isHover = hover && hover.id === g.id;
      g2.lineWidth = isSel ? 1.6 : 1;
      g2.strokeStyle = isSel ? 'rgba(255,255,255,0.9)' : isHover ? 'rgba(255,255,255,0.55)' : `rgba(255,255,255,${picking ? 0.22 : showGrid ? 0.1 : 0.05})`;
      g2.stroke();
      if (g.shelter > 0) { g2.setLineDash([3, 4]); g2.strokeStyle = `rgba(150,200,255,${0.4 + 0.5 * g.shelter / Sim.K.shelterDays})`; g2.lineWidth = 1.6; g2.stroke(); g2.setLineDash([]); }
    });
    // The coach's region: a gold outline, so its advice is easy to find.
    if (advice && advice.region !== undefined && selected !== advice.region && path(g2, cell(R[advice.region]))) {
      g2.strokeStyle = `rgba(255, 204, 102, ${0.5 + 0.35 * Math.sin(now / 300)})`; g2.lineWidth = 2; g2.setLineDash([6, 4]); g2.lineDashOffset = -now / 50; g2.stroke(); g2.setLineDash([]);
      const q = G.project(centre(R[advice.region]));
      if (q) tag('coach', `<span style="color:#ffcc66">${esc(Sim.regionName(R[advice.region]))}</span>`, q.x, q.y + 30, true, 'low');
    } else tag('coach', '', 0, 0, false);
    // Worlds: a dot for each planet that could hold life. Life only starts where there are some.
    R.forEach((g) => {
      if (!g.worlds || g.civ !== null) return;
      const q = G.project(centre(g)); if (!q) return;
      const lit = (hover && hover.id === g.id) || selected === g.id;
      g2.fillStyle = `rgba(255,255,255,${lit ? 1 : 0.7})`;
      for (let i = 0; i < g.worlds; i++) { g2.beginPath(); g2.arc(q.x + (i - (g.worlds - 1) / 2) * 7, q.y + 17, 2.2, 0, TAU); g2.fill(); }
    });
    // Life stirring, before anyone is there: a slow ring that tightens as it nears 1.
    R.forEach((g) => {
      if (g.civ !== null || g.life < 0.04) return;
      const q = G.project(centre(g)); if (!q) return;
      const k = clamp(g.life, 0, 1), p = 0.5 + 0.5 * Math.sin(now / 700 + g.id);
      const host = R.find((x) => x.civ !== null && x.n.includes(g.id) && s.civs[x.civ].home === x.id);
      g2.strokeStyle = host ? rgba(s.civs[host.civ].colour, 0.35 + 0.5 * k) : `rgba(160, 255, 200, ${0.25 + 0.5 * k})`; g2.lineWidth = host ? 1.6 : 1.2;
      g2.beginPath(); g2.arc(q.x, q.y, 4 + (1 - k) * 10 + p * 2, 0, TAU); g2.stroke();
      g2.fillStyle = `rgba(200, 255, 220, ${0.4 * k})`; g2.beginPath(); g2.arc(q.x, q.y, 1.6, 0, TAU); g2.fill();
    });
    // The calmed core: a quiet blue ring for as long as it lasts.
    if (s.bh.calm > 0) {
      const q = G.project([0, 0, 0]), e = G.project(at(EDGES[1] * 0.8, 0));
      if (q && e) { g2.strokeStyle = `rgba(150, 200, 255, ${0.25 + 0.4 * s.bh.calm / Sim.K.calmDays})`; g2.lineWidth = 1.4; g2.setLineDash([2, 5]); g2.beginPath(); g2.arc(q.x, q.y, Math.hypot(e.x - q.x, e.y - q.y), now / 3000, now / 3000 + TAU); g2.stroke(); g2.setLineDash([]); }
    }
    // Civilisations: territory, lights, a name.
    g2.globalCompositeOperation = 'lighter';
    s.civs.forEach((c) => {
      if (!c.alive) { tag('c' + c.id, '', 0, 0, false); return; }
      const pulse = 0.8 + 0.2 * Math.sin(now / 650 + c.id * 1.7);
      c.regions.forEach((id) => {
        const g = R[id];
        if (path(g2, cell(g))) { g2.fillStyle = rgba(c.colour, id === c.home ? 0.16 : 0.1); g2.fill(); }
        const n = id === c.home ? 4 + c.tech * 3 : 3 + c.tech;
        sprinkle(g, n).forEach((p, i) => {
          const q = G.project(p); if (!q) return;
          const big = i === 0 && id === c.home, r = big ? 22 + 5 * c.tech : 8 + 1.5 * c.tech;
          const gr = g2.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
          gr.addColorStop(0, rgba(c.colour, pulse)); gr.addColorStop(0.2, rgba(c.colour, 0.45 * pulse)); gr.addColorStop(1, rgba(c.colour, 0));
          g2.fillStyle = gr; g2.beginPath(); g2.arc(q.x, q.y, r, 0, TAU); g2.fill();
          g2.fillStyle = rgba(c.colour, 1); g2.beginPath(); g2.arc(q.x, q.y, big ? 2.6 : 1.4, 0, TAU); g2.fill();
        });
      });
      const h = G.project(centre(R[c.home]));
      if (h) {
        g2.fillStyle = '#fff'; g2.beginPath(); g2.arc(h.x, h.y, 2.2, 0, TAU); g2.fill();
        tag('c' + c.id, `${esc(c.name)}<small>${Sim.stage(c)} · ${c.regions.length} ${c.regions.length === 1 ? 'region' : 'regions'}</small>`, h.x, h.y, true);
      }
    });
    // Contact: an arc between every pair that has met, brighter while it's news.
    g2.globalCompositeOperation = 'lighter';
    s.civs.forEach((c) => c.met.forEach((o) => {
      if (o < c.id || !c.alive || !s.civs[o].alive) return;
      const d = s.civs[o], a = G.project(centre(R[c.home])), b = G.project(centre(R[d.home]));
      if (!a || !b) return;
      const age = (now - (contactAt.get(c.id + ':' + o) || 0)) / 3000, k = age < 1 ? 1 - age : 0;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - Math.hypot(b.x - a.x, b.y - a.y) * 0.25;
      const gr = g2.createLinearGradient(a.x, a.y, b.x, b.y); gr.addColorStop(0, rgba(c.colour, 0.35 + 0.6 * k)); gr.addColorStop(1, rgba(d.colour, 0.35 + 0.6 * k));
      g2.strokeStyle = gr; g2.lineWidth = 1.2 + 2 * k; g2.setLineDash([2, 6]); g2.lineDashOffset = -now / 60;
      g2.beginPath(); g2.moveTo(a.x, a.y); g2.quadraticCurveTo(mx, my, b.x, b.y); g2.stroke(); g2.setLineDash([]);
    }));
    // Ships: interstellar civilisations travel between their regions.
    s.civs.forEach((c) => {
      if (!c.alive || c.tech < 3 || c.regions.length < 2) return;
      const h = G.project(centre(R[c.home])); if (!h) return;
      c.regions.forEach((id, i) => {
        if (id === c.home) return;
        const q = G.project(centre(R[id])); if (!q) return;
        const k = ((now / 5200 + i * 0.37 + c.id * 0.13) % 1), e = k < 0.5 ? k * 2 : 2 - k * 2;
        g2.fillStyle = rgba(c.colour, 0.95); g2.beginPath(); g2.arc(lerp(h.x, q.x, e), lerp(h.y, q.y, e), 1.6, 0, TAU); g2.fill();
      });
    });
    // Beacons: a column of light over the home world.
    s.civs.forEach((c) => {
      if (!c.alive || !c.beacon) return;
      const h = G.project(centre(R[c.home])); if (!h) return;
      const tall = 220, w = 7 + 3 * Math.sin(now / 400 + c.id);
      const gr = g2.createLinearGradient(h.x, h.y, h.x, h.y - tall); gr.addColorStop(0, rgba(c.colour, 0.95)); gr.addColorStop(1, rgba(c.colour, 0));
      g2.globalCompositeOperation = 'lighter';
      g2.fillStyle = gr; g2.fillRect(h.x - w / 2, h.y - tall, w, tall);
      g2.fillStyle = rgba('#ffffff', 0.7); g2.fillRect(h.x - 1, h.y - tall * 0.8, 2, tall * 0.8);
      const halo = g2.createRadialGradient(h.x, h.y, 0, h.x, h.y, 34); halo.addColorStop(0, rgba(c.colour, 0.6)); halo.addColorStop(1, rgba(c.colour, 0));
      g2.fillStyle = halo; g2.beginPath(); g2.arc(h.x, h.y, 34, 0, TAU); g2.fill();
    });
    // Golden ages: a slow gold shimmer around the territory.
    s.civs.forEach((c) => {
      if (!c.alive || !c.golden) return;
      c.regions.forEach((id) => { if (path(g2, cell(R[id]))) { g2.strokeStyle = `rgba(255, 210, 110, ${0.35 + 0.25 * Math.sin(now / 500 + id)})`; g2.lineWidth = 1.5; g2.stroke(); } });
    });
    g2.globalCompositeOperation = 'source-over';
    // Threats: a ring that tightens as the strike nears, and a countdown.
    const live = new Set();
    s.threats.forEach((x) => {
      const left = x.at - s.day, k = 1 - clamp(left / (x.at - x.from || 1), 0, 1), p = 0.5 + 0.5 * Math.sin(now / (left < 5 ? 160 : 420));
      const col = THREAT[x.kind].colour, key = 't' + x.id;
      let pos = x.region === null ? at(1.08, 2.4) : centre(R[x.region]);
      if (x.kind === 'flare') pos = [0, 0, 0];
      const q = G.project(pos); if (!q) return;
      live.add(key);
      if (x.kind === 'grb') R[x.region].n.concat(x.region).forEach((id) => { if (R[id].ring && path(g2, cell(R[id]))) { g2.setLineDash([4, 4]); g2.strokeStyle = rgba(col, 0.35 + 0.3 * p); g2.lineWidth = 1.2; g2.stroke(); g2.setLineDash([]); } });
      const rr = (x.kind === 'flare' ? 46 : x.kind === 'collide' ? 30 : 26) * (1.2 - 0.7 * k);
      g2.strokeStyle = rgba(col, 0.5 + 0.4 * p); g2.lineWidth = 1.6 + k * 1.5;
      g2.beginPath(); g2.ellipse(q.x, q.y, rr, rr * squashNow, 0, 0, TAU); g2.stroke();
      tag(key, `${THREAT[x.kind].name}<small>${guarded(x) ? '✓ ' : ''}${dd(left)}</small>`, q.x, q.y + rr * squashNow, true, 'low');
    });
    // An omen's choices, marked where they are.
    const omenSeen = new Set();
    if (s.omen) s.omen.options.forEach((o, i) => {

      <p><b>The goal:</b> by the end of the year (13.8 billion years), a concord: at least ${Sim.K.concordMin} civilisations who know each other, and trust you. They appear on their own wherever a region stays habitable long enough. Your job is to make regions habitable, keep their peoples safe, and answer when they ask. Legacy scores everything along the way.</p>
      <p><b>Life needs three things in a region.</b> Tap any region to see which it is missing:</p>
      <ul>
        <li><i style="background:#c9a27a"></i><span><b>Metals</b>, heavy elements for rocky planets. Stars make them by living and dying, so they build up over time.</span></li>
        <li><i style="background:#9fd0ff"></i><span><b>Calm</b>, a long stretch without supernovae or black hole flares.</span></li>
        <li><i style="background:#ffe1b0"></i><span><b>Sunlike stars</b>, long-lived ones that planets can circle. They form from gas.</span></li>
      </ul>
      <p>When all three are there, the region turns <b style="color:#3fbf85">green</b>. Life starts as a pulsing ring and, given time, becomes a civilisation with its own lights and name.</p>
      <p><b>Worlds.</b> The white dots on a region are worlds that could hold life. No dots, no life, however green it gets.</p>
      <p><b>To act</b>, tap a region and use the buttons on its card. Or pick a tool in the dock, then tap a region. Tools cost influence: a little every day, and +${Sim.K.sparkGain} for every stardust ✦ you tap. It holds up to ${Sim.K.influenceMax}.</p>
      <p><b>Warnings</b> appear at the top with a countdown: a supernova or gamma-ray burst (shelter the region), a black hole flare (calm the core), the companion galaxy falling in (merge it). A strike on a civilisation you didn't shield can destroy a colony or burn their cities; it leaves a scar, and they know you saw it coming.</p>
      <p><b>Requests</b> come from civilisations once they reach spaceflight, each in their own character. Answer and they trust you more; ignore them and they trust you less. Some requests cost others: inviting settlers into a region ends any life growing there. Refuse, and that life stays its own: when it wakes, it becomes a new people. Life you nurse next to a people's home, unasked, joins them when it's ready, and they thank you. Late in the year a storm of supernovae comes for several homes at once, and great civilisations ask for help lighting a <b>beacon</b>.</p>
      <p><b>Uplift</b> (on a people's card, 4 influence) invests in them: they develop faster, and their world shows it. <b>Keeping life apart:</b> life that wakes beside a people's home joins them, unless you've nursed it well (nurture ${Math.round(Sim.K.apartNurture / Sim.K.nurtureMax * 100)}%, about four shelters) and it is sheltered when it wakes: then it becomes a people of its own. <b>The last test:</b> a month before the end, peoples only just over the concord's line ask for one more sign of care.</p>
      <p><b>Challenges:</b> in months 2 to 5, and again around months 7 and 9, the galaxy sets one aim at a time (life in more regions, a nursed region, a new people, a people's next stage, stardust), with ${Sim.K.challengeFor} days to meet it. How is up to you. Each one met is worth +${Sim.K.challengeWorth} legacy; a missed one just passes.</p>
      <p><b>Their worlds:</b> tap a people's lights and press <b>See their world</b> (or double-click them) to visit their planet. It changes as they grow: city lights on the night side, then roads, satellites and rockets, an orbital ring and colony worlds, and at last a world that is all city. Strikes scar it; a golden age lights the poles.</p>
      <p><b>Influence</b> holds up to ${Sim.K.influenceMax}. What you earn past that is <b>banked</b> (up to ${Sim.K.bankMax}) and flows back ${Sim.K.bankFlow} a day once you spend below full: a reserve for the busy months. When influence runs short, an action draws on the bank.</p>
      <p><b>Trust</b> comes from what you do: answer a people's requests and shield them from warned strikes, and they grow grateful; ignore them, pass them over in a dispute, or let a warned strike hit them, and they cool. It doesn't fade on its own. Peoples who can't see you yet don't count toward the concord.</p>
      <p><b>The concord</b>: from month 7, the civilisations talk of uniting. If at least ${Sim.K.concordMin} peoples in contact, and two in three of them, trust you (grateful or better) when the year ends, it ends in a concord.</p>
      <p><b>Legacy</b> is your score: every civilisation alive at the end, how far it got, its golden age, its beacon, how it feels about you, minus its scars. The end screen shows how it adds up.</p>
      <div class="tools">${ACTIONS.map((a) => `<div>${ICONS[a.kind]}<span><b>${a.label}</b> · ${Sim.K.cost[a.kind]}. ${esc(a.what)}</span></div>`).join('')}</div>
      <p>Stuck? The card under the clock always suggests a next step.</p>`;
  }
  // ---- alerts: every warning and request, most urgent first, each with its answer ------------

  function alerts() {

      const sub = a.threat ? `${dd(a.left)}${a.ok ? (a.threat === 'flare' ? ' · calmed in time' : sheltered || a.threat === 'grb' ? ' · sheltered' : ' · nothing at risk there') : ''}` : `${dd(a.left)} to answer`;
      return Object.assign({}, a, a.omen ? { colour: '#b9a6ff', sub: `${esc(s.omen.text)} <b>${dd(a.left)} to choose · free</b>` } : { colour: a.threat ? THREAT[a.threat].colour : s.civs[a.civ].colour, sub });

  function renderAlerts() {

    ghosts.forEach((g, k) => { if (g.until < nowT) ghosts.delete(k); });
    const order = (box._order || []).filter((k) => open.some((a) => alertKey(a) === k) || ghosts.has(k));
    open.forEach((a) => { if (!order.includes(alertKey(a))) order.push(alertKey(a)); });
    box._order = order;
    const all3 = order.map((k) => open.find((a) => alertKey(a) === k) || Object.assign({}, ghosts.get(k).a, { ghost: true, age: 1500 - (ghosts.get(k).until - nowT) }));
    const pin = (a) => a.dispute || a.omen || (a.threat && !a.ok), list = all3.filter(pin).concat(all3.filter((a) => !pin(a))).slice(0, box._all ? 12 : 3), more = open.length + ghosts.size - list.length;
    box._last = Object.fromEntries(open.map((a) => [alertKey(a), a]));
    const key = Math.floor(s.influence) + '|' + covered + '|' + more + '|' + list.map((a) => a.text + a.sub + (a.ghost ? 'g' : '')).join('|');
    if (box._key === key) return;
    box._key = key;
    // Same rows, same buttons: update the countdowns in place, so a click in flight still lands.
    const beaconLeft = (a) => { const k = s.civs[a.civ].ask; return k && k.regions ? k.regions.length - k.done.length : 0; };
    const beaconSays = (a) => ` · ${beaconLeft(a)} ${beaconLeft(a) === 1 ? 'shelter' : 'shelters'} to go, ${Sim.K.cost.shelter * beaconLeft(a)} influence`;
    const shape = covered + '|' + more + '|' + list.map((a) => alertKey(a) + (a.ghost ? 'g' : '') + (a.kind && !a.omen ? canDo(ACTIONS.find((x) => x.kind === a.kind)) : '') + (a.beacon ? beaconLeft(a) : '')).join('|');
    if (box._shape === shape) {

        if (!sm) return;

    }
    box._shape = shape;
    const was = box._seen || new Set();
    box._seen = new Set(list.map(alertKey));

    const sigOf = (a) => alertKey(a) + a.text + (a.ghost ? 'g' : '') + (a.kind && !a.omen ? canDo(ACTIONS.find((x) => x.kind === a.kind)) : '') + (a.beacon ? beaconLeft(a) : '') + '|' + covered;
    const kept = new Map([...box.children].map((r) => [r.dataset.sig, r]));
    box.innerHTML = '';
    list.forEach((a) => {
      const old = !a.ghost && !a.omen && kept.get(sigOf(a)), oldSm = old && old.querySelector('span > small');
      if (oldSm) { old.classList.remove('new'); old.classList.toggle('hot', a.left <= 4); oldSm.firstChild.textContent = a.sub + (a.beacon ? beaconSays(a) : ''); box.append(old); return; }
      const row = document.createElement('div'); row.dataset.sig = sigOf(a);
      row.className = 'alert card' + (a.left <= 4 ? ' hot' : '') + (was.has(alertKey(a)) ? '' : ' new'); row.dataset.k = alertKey(a);
      row.innerHTML = `<i style="background:${a.colour}"></i><span>${esc(a.text)}<small>${a.sub}</small></span>`;
      if (a.ghost) { row.classList.add('ghost'); row.style.animationDelay = `-${Math.max(0, a.age)}ms`;   // a re-render mustn't restart it
        box.append(row); return; }
      const tool = ACTIONS.find((x) => x.kind === a.kind), cost = Sim.K.cost[a.kind];
      const btn = (label, primary, fn, off) => { const b = UI.button({ variant: primary ? 'primary' : undefined, label, onClick: (ev) => { ev.stopPropagation(); fn(); } }); if (off) { b.disabled = true; b.style.opacity = 0.45; } return b; };
      const no = (civ) => () => { apply('refuse', undefined, civ); };
      if (a.omen) {
        const box2 = document.createElement('div'); box2.className = 'choices';
        s.omen.options.forEach((o, i) => { const b = btn(o.label, i < s.omen.options.length - 1 || s.omen.options.length === 2, () => { apply('choose', i); if (omenPaused) { omenPaused = false; resume(lastSpeed || 1); } }); if (o.fx[1] !== undefined) { let was = null; b.addEventListener('mouseenter', () => { was = selected; selected = o.fx[1]; renderCard(); }); b.addEventListener('mouseleave', () => { if (selected === o.fx[1]) { selected = was; renderCard(); } }); } box2.append(b); });
        row.append(box2);
      } else if (a.civ === undefined) row.append(btn(`${tool.label}${a.region !== undefined ? ' ' + Sim.regionName(s.regions[a.region]) : ''} · ${cost}`, true, () => act(a.kind, a.region), !canDo(tool)));
      else {
        const box2 = document.createElement('div'); box2.className = 'choices';
        const d = (v) => `${v > 0 ? '+' : '−'}${Math.abs(v)}`, nm = (id) => s.civs[id].name;
        const minders = (chosen, other) => { const out = []; const rv = Sim.rivalOf(s, s.civs[chosen]); if (rv && rv.aware && rv.id !== other) out.push(`the ${rv.name} −${Sim.K.rivalHit} (their rivals)`); if (rv && rv.aware && rv.id === other) out.push(`the ${rv.name} a further −${Sim.K.rivalHit}, as their rivals`); s.civs.forEach((o) => { if (o.id !== chosen && o.id !== other && o.alive && o.aware && o.regions.some((id) => s.regions[id].n.includes(a.region))) out.push(`the ${o.name} −0.5 (they border it)`); }); return out; };
        const sch = a.dispute && s.civs[a.civ].ask && s.civs[a.civ].ask.schism;
        const disputeCost = a.dispute ? [a.civ, a.rival].map((id) => { const m = minders(id, id === a.civ ? a.rival : a.civ); return m.length ? ` ${sch ? 'Side with' : 'Give it to'} the ${nm(id)}: also ${m.join(', ')}.` : ''; }).join('') + (a.region !== undefined && s.regions[a.region].life > 0.05 ? ' Life is growing there: whoever settles it ends it.' : '') : '';
        const tcost = (a.dispute ? `Trust: the one you choose ${d(2)}, the other ${d(sch ? -Sim.K.schismHit : -2)}. Neither: both ${d(-(sch ? 2 : 1) * Sim.K.refuseHit)}.${disputeCost}` : a.beacon ? `Trust: lit ${d(2)}; unlit ${d(-1.5)}.` : `Trust: answer ${d(2)}; say no ${d(-Sim.K.refuseHit)}; ignore ${d(-1.5)}.`) + ' (grateful at +1)' + (() => { const rv = Sim.rivalOf(s, s.civs[a.civ]); return rv && rv.aware && !a.dispute ? ` Their rivals the ${rv.name}: −${Sim.K.rivalHit} if you answer.` : ''; })();
        row.querySelector('small').insertAdjacentHTML('beforeend', `<span class="cost">${tcost}${!canDo(tool) ? ` Needs ${Sim.K.cost[a.kind]} influence.` : ''}</span>`);
        if (a.dispute) {
          [a.civ, a.rival].forEach((id) => box2.append(btn(`${sch ? 'Side with' : 'Give it to'} the ${s.civs[id].name} · ${cost}`, true, () => act(a.kind, a.region, id), !canDo(tool))));
          box2.append(btn('Neither', false, () => { apply('refuse', undefined, a.civ); apply('refuse', undefined, a.rival); }));

  function renderAll() { renderClock(); renderPower(); renderCoach(); coachReady(); renderDock(); renderCard(); renderHint(); renderToolcard(); renderAlerts(); }

  // ---- what you do ----------------------------------------------------------------------
  // A dock tool never fires on its own: a region tool arms (tap a region to use it), a global
  // tool asks for a confirm in the card above the dock. Region cards and the coach act directly.
  function use(a) {
    if (!canDo(a)) { UI.toast(a.kind === 'merge' && Sim.month(s) < 2 ? 'The companion can be merged from month 3' : `Needs ${Sim.K.cost[a.kind]} influence`); return; }
    if (a.kind === 'calm') { selected = 0; act('calm'); return; }   // one core: nothing to pick
    picking = picking === a.kind ? null : a.kind;
    renderAll();
  }
  function act(kind, region, civ) {                             // a direct answer: from a region card, an alert or the coach
    const a = ACTIONS.find((x) => x.kind === kind);
    if (!canDo(a)) { UI.toast(`Needs ${Sim.K.cost[kind]} influence`); return; }
    if (region !== undefined) selected = region;
    apply(kind, region, civ);
  }
  function apply(kind, region, civ) {
    const res = Sim.act(s, kind, region, civ);
    picking = null;
    if (!res.ok) { UI.toast(res.why === 'influence' ? 'Not enough influence yet' : 'Not now'); renderAll(); return; }
    const p = region !== undefined ? centre(s.regions[region]) : [0, 0, 0];
    if (kind === 'seed') burst(p, '#9cc0ff', 0.12, 1400, true);
    if (kind === 'shelter') burst(p, '#9fd0ff', 0.14, 1400, false);
    if (kind === 'starburst') { burst(p, '#ff9fd0', 0.2, 1600, true); burst(p, '#ffffff', 0.1, 900, true); }
    if (kind === 'calm') burst(p, '#a8d4ff', 0.25, 1600, false);
    if (kind === 'uplift') { burst(p, '#ffd27a', 0.16, 1800, true); burst(p, '#ffffff', 0.08, 900, false); }
    if (kind === 'merge') { stream('#ffe1b0', 4000); burst([0, 0, 0], '#ffe1b0', 1.1, 4200, false); burst([0, 0, 0], '#ffffff', 0.7, 3200, false); s.regions.filter((g) => g.ring === 3).forEach((g) => burst(centre(g), '#ffd9a0', 0.14, 4200, true)); flareGlow = 0.8; banner('The merger', 'The companion galaxy pours gas and metals into your outer ring'); }
    news(); save(); coachForce = true; renderAll();
  }

  // ---- stardust: tap it and it flies to your influence ------------------------------------------
  function sparkAt(x, y) {
    let best = null, bd = matchMedia('(hover: none)').matches ? 26 : 18;
    sparkPos.forEach((q, id) => { const d = Math.hypot(q.x - x, q.y - y); if (d < bd) { bd = d; best = id; } });
    return best;
  }
  function collect(id) {
    const q = sparkPos.get(id);
    if (!Sim.act(s, 'collect', id).ok) return;
    const el = document.createElement('div'); el.className = 'plus'; el.textContent = '+' + Sim.K.sparkGain;
    el.style.left = q.x + 'px'; el.style.top = q.y + 'px'; document.body.append(el);
    const t = $('power').getBoundingClientRect();
    requestAnimationFrame(() => { el.style.transform = `translate(${t.left + t.width / 2 - q.x}px, ${t.top + 20 - q.y}px) scale(0.8)`; el.style.opacity = 0.2; });
    setTimeout(() => el.remove(), 950);

  }

  // ---- input: tap a region, drag to turn, scroll to zoom --------------------------------------
  const hit = $('hit');
  let drag = null;
  const touches = new Map();                                    // two fingers pinch to zoom
  let pinch = null;
  hit.addEventListener('pointerdown', (e) => {
    touches.set(e.pointerId, [e.clientX, e.clientY]);
    hit.setPointerCapture(e.pointerId);
    if (touches.size === 2) { const [a, b] = [...touches.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), dist: G.camera().dist }; drag = null; return; }

  });
  const lift = (e) => { touches.delete(e.pointerId); if (touches.size < 2) pinch = null; };

    if (pinch) { const [a, b] = [...touches.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomTo(pinch.dist * pinch.d / Math.max(1, d), (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); return; }

    hit.classList.remove('dragging');
    if (wasPinch) { drag = null; return; }
    const d = drag; drag = null;
    if (!d || d.moved) return;
    const sp = sparkAt(e.clientX, e.clientY);
    if (sp) { collect(sp); return; }
    const g = regionAt(e.clientX, e.clientY);
    if (picking === 'calm' && g && g.ring === 0) { selected = 0; apply('calm'); return; }
    const armed = picking && ACTIONS.find((x) => x.kind === picking).region;
    if (armed) { if (g && g.ring > 0) { selected = g.id; apply(picking, g.id); } else if (!g) { picking = null; renderAll(); } return; }
    selected = g ? g.id : null;
    renderAll();
  });
  hit.addEventListener('pointerleave', () => { hover = null; });
  hit.addEventListener('dblclick', (e) => { if (!s) return; const g = regionAt(e.clientX, e.clientY); if (g && g.civ !== null) world.open(g.civ); });
  hit.addEventListener('wheel', (e) => { e.preventDefault(); zoomTo(G.camera().dist * Math.exp(e.deltaY * 0.0012), e.clientX, e.clientY); }, { passive: false });
  // Zooming in drifts the view toward the region under the pointer; zooming out drifts it home.
  const ZOOM_NEAR = 0.07, ZOOM_FAR = 6;
  let homeCam = null;
  $('home').addEventListener('click', () => { const c = G.camera(); if (homeCam) G.setCamera(Object.assign(c, { dist: homeCam.dist, focus: homeCam.focus.slice(), pitch: homeCam.pitch })); $('home').hidden = true; });
  function zoomTo(dist, x, y) {
    if (!s) return;
    const c = G.camera(), nd = clamp(dist, ZOOM_NEAR, ZOOM_FAR);
    let target = null, k = 0;
    if (nd < c.dist) { const g = regionAt(x, y); if (g) { target = centre(g); k = 1 - nd / c.dist; } }
    else if (nd > c.dist) { target = [0, 0, 0]; k = clamp((nd - c.dist) / Math.max(0.01, 2.4 - c.dist), 0, 1); }
    const f = c.focus.slice();
    if (target) for (let i = 0; i < 3; i++) f[i] += (target[i] - f[i]) * k;
    if (!homeCam) homeCam = JSON.parse(JSON.stringify(c));

    $('home').hidden = !(nd < homeCam.dist * 0.6 || Math.hypot(...f) > 0.3);

  addEventListener('keydown', (e) => {

    const n = '123'.indexOf(e.key); if (n >= 0) setSpeed(SPEEDS[n + 1]);
    const a = ACTIONS[['q', 'w', 'e', 'r', 't'].indexOf(e.key.toLowerCase())]; if (a && !e.metaKey && !e.ctrlKey) use(a);
  });
  let lastSpeed = 1, lastWhole = 0, omenPaused = false;

  // ---- the start and the end --------------------------------------------------------------
  function modal(html, buttons) {

  function intro(saved) {
    setSpeed(0);
    modal(`<h2>Grow a galaxy until it grows life</h2>
      <p>Your galaxy has just lit up. In a year it will be 13.8 billion years old. One young people already lives in it, on a seed world: keep them safe, and help the galaxy make more along the way.</p>
      <ol class="steps">
        <li><span><b>Forge metals early.</b> In the first month, starburst a few gassy regions where nothing lives yet, away from your seed world.</span></li>
        <li><span><b>Tap the stardust ✦.</b> Exploding stars leave it behind. Each one is influence to spend.</span></li>
        <li><span><b>Shelter green regions with worlds.</b> Green means life could start; the white dots are worlds that could hold it.</span></li>
        <li><span><b>Answer warnings and requests.</b> Supernovae, flares and the civilisations themselves will ask things of you. Each comes with a button. Tap any region to see what it needs, and act from its card.</span></li>
      </ol>
      <p>Everyone gets the same <b>galaxy of the day</b>: same worlds, same threats, same peoples. Or play a random one.</p>
      <p><b>The goal:</b> end the year in a concord, with most of the peoples who know each other trusting you. Legacy scores every civilisation, how far it gets and how it feels about you. Three stars is hard. The card under the clock always suggests a next step. A year takes about 15 minutes at 1×, and the game saves as you go.</p>`,
      saved ? [['A random galaxy', () => newGalaxy(fresh())], [dayBests()[today()] ? `Today's galaxy · best ${dayBests()[today()]}` : "Today's galaxy", () => newGalaxy(today())], [`Continue, month ${Math.floor(saved.day / Sim.MONTH) + 1}`, () => { setSpeed(0); UI.toast('Paused: press 1× when you are ready'); }, true]]
        : [['A random galaxy', () => newGalaxy(fresh())], [dayBests()[today()] ? `Today's galaxy · best ${dayBests()[today()]}` : "Today's galaxy", () => newGalaxy(today()), true]]);
  }
  const MARKS = [
    ['habitable', 'Habitable', 'A region with enough metals, calm and long-lived stars'], ['life', 'Life', 'Life takes hold somewhere'],
    ['civ', 'Civilisation', 'The first people arise'], ['flight', 'Spaceflight', 'Someone reaches space, and can see you'],
    ['contact', 'Contact', 'Two peoples meet'], ['golden', 'Golden age', 'A people holds four regions in a long calm'],
    ['five', 'Five at once', 'Five civilisations alive at the same time'], ['ten', 'Ten regions', 'Ten regions inhabited'],
    ['beacon', 'Beacon', 'Help a great people light a beacon'], ['survivor', 'Comeback', 'A people that collapsed reaches the stars again'],
    ['concord', 'Concord', 'Four peoples in contact, who trust you, unite'],
  ];
  // One line to remember each civilisation by, from its own story.
  function epilogue(c) {
    const mine = s.log.filter((e) => e.civ === c.id);
    if (!c.alive) return 'They are gone. The chronicle keeps their name.';
    if (c.beacon) return 'Their beacon shines across the galaxy. They lit it with your help.';
    const blame = mine.filter((e) => e.blame).length, shields = mine.filter((e) => e.you && /shield|pass/.test(e.text)).length;
    if (blame > c.honoured + shields) return `They remember the strikes you saw coming and let fall.`;
    if (c.honoured >= 3) return `They remember you as the one who answered them, or knew before they asked: ${c.honoured} times.`;
    if (c.honoured + shields >= 3) return `They remember you as the one who came: ${c.honoured} ${c.honoured === 1 ? 'answer' : 'answers'}, ${shields} ${shields === 1 ? 'strike' : 'strikes'} turned aside.`;
    if (c.golden) return 'A golden age, and a long calm to enjoy it in.';
    if (c.tech >= 3) return c.regions.length > 1 ? `They reached the stars, and spread across ${c.regions.length} regions.` : 'They reached the stars, but stayed close to home.';
    return `Still on their world, at ${Sim.stage(c).toLowerCase()}. They have only begun to look up.`;
  }
  function finale() {
    ended = true; setSpeed(0);
    const alive = s.civs.filter((c) => c.alive), L = Sim.legacy(s), st = Sim.stars(s);
    const best = store.get(BEST) || 0;
    if (L > best) store.set(BEST, L);
    if (isToday()) { const b = dayBests(); if (!(b[today()] >= L)) { b[today()] = L; store.set(BEST + '-days', b); } }
    const share = `Galaxy sim · ${isToday() ? new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : 'a random galaxy'} · ${'★'.repeat(st)}${'☆'.repeat(3 - st)} ${L} · ${alive.length} ${alive.length === 1 ? 'people' : 'peoples'}${s.concord ? " · the Gardener's Concord" : ''}`;
    finale.share = share;
    // What would have helped most, from what happened this year.
    const tips = [];
    const ignored = s.log.filter((e) => e.ignored).length, setbacks = s.log.filter((e) => e.setback || e.collapse).length;
    const crashed = s.log.some((e) => e.strike === 'collide'), bursts = s.actions.filter((a) => a.kind === 'starburst' && a.day < 50).length;
    if (!s.concord && s.civs.length >= 3) tips.push(`No concord. It needs at least ${Sim.K.concordMin} peoples in contact, two in three of them grateful or better, when the year ends: answer their requests, and shield them when warnings come.`);
    if (ignored) tips.push(`${ignored} ${ignored === 1 ? 'request went' : 'requests went'} unanswered. Each answer is worth legacy and trust.`);
    if (setbacks) tips.push(`${setbacks === 1 ? 'Once' : setbacks + ' times'} a strike hit a people. Each leaves a scar (−4) and costs trust: shelter whatever a warning points at.`);
    if ((s.sparksLost || 0) > 8) tips.push(`${s.sparksLost} stardust faded untouched. Each one is +${Sim.K.sparkGain} influence.`);
    if (bursts < 2) tips.push('Starburst two or three gassy regions in the first month: the metals arrive sooner, and so does life.');
    if (crashed) tips.push('Merge the companion galaxy around month 3. Left alone, it crashed in and shook everything.');
    if (!tips.length) tips.push(st === 3 ? 'A near-perfect year. Try a new galaxy: each has its own character, worlds, threats and peoples.' : 'A clean year: the third star is in more peoples, more golden ages and beacons, and the concord. Each galaxy has its own character: try another.');
    const parts = Sim.legacyParts(s);
    const cc = s.concord ? `<div class="concord-moment">${s.concord.members.map((id) => `<i style="background:${s.civs[id].colour}"></i>`).join('')}<b>The Gardener's Concord</b><small>${s.concord.members.map((id) => s.civs[id].name).join(' · ')}</small></div>` : '';
    modal(`${cc}<div class="stars">${'★'.repeat(st)}<span>${'★'.repeat(3 - st)}</span></div>
      <h2>${alive.length ? `${alive.length} ${alive.length === 1 ? 'civilisation' : 'civilisations'} at 13.8 billion years` : 'A quiet galaxy'}</h2>
      <div class="score"><span>Legacy${L > best && best ? ' · a new best' : best ? ` · best ${Math.max(best, L)}` : ''}</span><b>${L}</b></div>
      <p>${st < 3 ? `${Sim.STARS[st]} for ${'★'.repeat(st + 1)}.` : 'All three stars.'} ${s.concord ? "The year ended in the Gardener's Concord." : ''}</p>
      ${s.civs.length ? `<div style="display:grid;gap:6px">${s.civs.map((c) => { const pt = parts.find((x) => x.civ === c.id); return `<div class="civ-row"><i style="background:${c.colour}"></i><span><b>${esc(c.name)}</b> · ${c.alive ? Sim.stage(c).toLowerCase() : 'gone'}${c.golden ? ' · golden age' : ''}<br><small style="text-align:left">${esc(epilogue(c))}</small></span><small>${pt ? `+${pt.total}` : '0'}<br>${Sim.viewOf(c)}</small></div>`; }).join('')}</div>` : ''}
      ${parts.filter((p) => p.civ === undefined).map((p) => `<div class="civ-row"><i style="background:#ffcc66"></i><span><b>${esc(p.label)}</b></span><small>+${p.total}</small></div>`).join('')}
      <details class="breakdown"><summary>How the score adds up</summary>${parts.map((p) => `<div><span>${esc(p.label)}${p.items ? `<small>${p.items.map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join(' · ')}</small>` : ''}</span><b>${p.total}</b></div>`).join('')}</details>
      <div class="sub">Next time</div><div class="tips">${tips.slice(0, 3).map((t) => `<div>${esc(t)}</div>`).join('')}</div>
      <div class="marks">${MARKS.map(([k, t, why]) => `<span class="${s.milestones[k] !== undefined ? 'got' : ''}" title="${why}" data-why="${t}: ${why}">${t}</span>`).join('')}</div><p class="why" style="font-size:11.5px;color:var(--ink-3);margin-top:6px">Tap a mark to see what earns it.</p>`,
      [['Look around', () => { $('reopen').hidden = false; }], ['New galaxy…', () => confirmNew(), true]]);
    $('modal').querySelector('.marks').addEventListener('click', (ev) => { const w = ev.target.closest && ev.target.closest('[data-why]'); if (w) $('modal').querySelector('.why').textContent = w.dataset.why; });
    const copy = UI.button({ label: 'Copy your result', onClick: () => { try { navigator.clipboard.writeText(share).then(() => UI.toast('Copied: ' + share)); } catch (e) { UI.toast(share); } } });
    $('modal').querySelector('.pair').before(copy);
  }
  function confirmNew() {
    modal(`<h2>Start a new galaxy?</h2><p>Your result and your best legacy are kept.</p>`, [['Back to the result', () => finale()], ['A random galaxy', () => newGalaxy(fresh())], ["Today's galaxy", () => newGalaxy(today()), true]]);
  }

  $('reopen').addEventListener('click', () => { $('reopen').hidden = true; finale(); });

  // ---- the loop --------------------------------------------------------------------------
  let last = performance.now(), lastDay = -1;
  function frame(now) {
    requestAnimationFrame(frame);                                // first, so no slip below can ever stop the clock
    const dt = Math.min(250, now - last); last = now;
    if (!s) return;                                             // before a galaxy is chosen
    if (speed) lastSpeed = speed;
    if (speed && !ended && document.visibilityState === 'visible') {
      acc += dt * speed / DAY_MS;
      let n = 0;
      while (acc >= 1 && n < 8 && s.day < Sim.YEAR) {
        Sim.step(s); acc -= 1; n++;
        const why = speed > 1 && alarm();
        if (why) { acc = 0; slow(why); break; }
      }
      if (s.day >= Sim.YEAR) { acc = 0; ended = true; news(); save(); setTimeout(finale, s.concord ? 5000 : 800); }
    }
    if (s.day !== lastDay) {
      lastDay = s.day; news(); renderClock(); renderPower(); renderCoach(); coachReady(); renderDock(); renderHint(); renderAlerts();
      if (selected !== null && Math.floor(s.influence) !== lastWhole) renderCard();
      lastWhole = Math.floor(s.influence);
      if (selected !== null) renderCard();
      save();
    }
    try { look(dt); draw(now); } catch (err) { console.error(err); }
  }

  const saved = store.get(SAVE);
  if (saved && saved.seed && saved.day > 0 && saved.day < Sim.YEAR) start(saved.seed, saved.actions, saved.day);
  else start(Math.floor(Math.random() * 1e6) + 1);
  // ?seed=n&day=d starts a given galaxy at a given day (handy for testing a late game).
  const q = new URLSearchParams(location.search);
  if (q.get('seed')) start(+q.get('seed'), [], +q.get('day') || 0);
  if (q.get('seed')) setSpeed(+q.get('speed') || 0); else intro(saved && saved.day > 0 && saved.day < Sim.YEAR ? saved : null);
  requestAnimationFrame(frame);
  window.simDebug = { world: (id) => world.open(id), worldOpen: () => world.isOpen(), camera: () => G.camera(), zoomTo: (d, x, y) => zoomTo(d, x, y), state: () => s, sparks: () => [...sparkPos.entries()], act: (k, r) => apply(k, r), at: (id) => G.project(centre(s.regions[id])) };   // for automated playtests
})();
</script>
</body>
</html>
